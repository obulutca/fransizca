<style>html,body{margin:0;padding:0} body{padding-top:env(safe-area-inset-top,0px)}</style></head><body>
<title>Fransızca Akademi</title>
<script>try{var tm=localStorage.getItem('fr-tema');if(tm==='light'||tm==='dark')document.documentElement.dataset.theme=tm}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* Layout: one narrow app column. Each screen does one job; the primary action sits at the bottom in thumb reach; a two-tab bar (Tekrar / Oku-Dinle) keeps the two parts apart and hides during a session. French text is set in the serif, the interface in the sans. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#18202F; --muted:#626B7E; --line:#DDE1E9; --soft:#ECEFF5;
  --accent:#2A44D4; --accent-ink:#FFFFFF; --hl:#E3E8FF; --good:#1E8A52; --good-bg:#E3F4EA; --bad:#C2412D; --bad-bg:#FBE9E5; --warn:#9A6200; --warn-bg:#FBF0DA;
  --fr:"Instrument Serif",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#9AA2B4; --line:#2B3140; --soft:#232837;
  --accent:#8FA3FF; --accent-ink:#11141B; --hl:#262F52; --good:#5FCB8E; --good-bg:#183326; --bad:#F08A76; --bad-bg:#3A1F1A; --warn:#F0C060; --warn-bg:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#9AA2B4; --line:#2B3140; --soft:#232837;
  --accent:#8FA3FF; --accent-ink:#11141B; --hl:#262F52; --good:#5FCB8E; --good-bg:#183326; --bad:#F08A76; --bad-bg:#3A1F1A; --warn:#F0C060; --warn-bg:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 20px;display:flex;flex-direction:column;gap:16px}
.nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8125rem;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.top h1{font-size:1.25rem;margin:0;font-weight:700}
.icon{border:0;background:none;width:40px;height:40px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon svg{width:22px;height:22px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.big-btn{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;font-size:1.0625rem;font-weight:700}
.big-btn:disabled{opacity:.45;cursor:default}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;text-align:left}
.grow{flex:1;min-width:0} .spacer{flex:1}
.bottom{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
/* home */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.count{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px}
.resume{background:var(--hl);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.week i{width:24px;height:24px;border-radius:99px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.6875rem;color:var(--muted)}
.week i.on{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-width:0}
.stats b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.sync{font-size:.75rem;color:var(--muted);text-align:center}
/* session */
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.kind{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.flip{perspective:1400px;cursor:pointer}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;min-height:280px}
.face.front{justify-content:center;align-items:center;text-align:center}
.face.back{transform:rotateY(180deg)}
.hint{font-size:.8125rem;color:var(--muted)}
.fr-big{font-family:var(--fr);font-size:2.4rem;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.fr-mid{font-family:var(--fr);font-size:1.75rem;line-height:1.15;overflow-wrap:anywhere}
.tr-big{font-size:1.375rem;font-weight:600;line-height:1.3}
.en{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9375rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;align-items:flex-start}
.ex .t{font-family:var(--fr);font-size:1.25rem;line-height:1.3}
.ex .s{color:var(--muted);font-size:.875rem}
.note{font-size:.875rem;background:var(--soft);border-radius:10px;padding:8px 10px}
.lines p{margin:0 0 6px}
.say{border:1px solid var(--line);background:var(--soft);color:var(--accent);width:44px;height:44px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say.sm{width:34px;height:34px}
.say svg{width:20px;height:20px} .say.sm svg{width:16px;height:16px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
.grades button small{font-weight:500;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.grades .g1{color:var(--bad)} .grades .g3{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-size:1.0625rem;display:flex;gap:12px;align-items:center}
.opt .n{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:.8125rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.frt{font-family:var(--fr);font-size:1.3rem}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.answer{width:100%;font:inherit;font-size:1.25rem;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.answer:focus{border-color:var(--accent);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;font-size:1.0625rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.built{border-bottom:2px solid var(--line);padding-bottom:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--fr);font-size:1.25rem;line-height:1.1;box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}
.cloze{font-family:var(--fr);font-size:1.5rem;line-height:1.35}
.cloze .gap{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent)}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.near{background:var(--warn-bg);color:var(--warn)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{font-size:1rem} .fb .fr-a{font-family:var(--fr);font-size:1.5rem;color:var(--ink);line-height:1.2}
.fb .you{font-size:.9375rem;color:var(--ink)}
.fb .you .x{background:var(--bad-bg);color:var(--bad);border-radius:3px;text-decoration:line-through}
.dict{display:flex;justify-content:center;gap:12px;padding:8px 0}
.dict .say{width:72px;height:72px} .dict .say svg{width:30px;height:30px}
.dict .say.slow{font-weight:700;font-size:.875rem}
/* settings & lists */
.set{display:flex;flex-direction:column;gap:8px}
.set label{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-family:var(--fr);font-size:1.25rem;line-height:1.2}
.item .s{font-size:.875rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.okc{color:var(--good)} .noc{color:var(--bad)}
.chip{font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);display:inline-block;margin-bottom:4px}
.chip.k1{background:var(--hl);color:var(--accent)} .chip.k3{background:var(--good-bg);color:var(--good)} .chip.k2{background:var(--warn-bg);color:var(--warn)}
.done-mark{color:var(--good);font-weight:700}
/* 14-day chart */
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.chart button{border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.chart .b{width:min(100%,14px);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.zero{background:var(--soft)}
.chart button[aria-pressed="true"] .b{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.6875rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tip{font-size:.875rem;min-height:1.5em}
/* reader */
.steps{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.steps button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.875rem;color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 8px}
.listen .t{font-family:var(--fr);font-size:2rem;line-height:1.1}
.lines2{display:flex;flex-direction:column;gap:2px}
.line{padding:8px 10px;border-radius:10px;cursor:pointer}
.line .who{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.line .who.v-jessica,.line .who.v-siwis{color:var(--warn)}
.line .f{font-family:var(--fr);font-size:1.375rem;line-height:1.35}
.line .tr{font-size:.9375rem;color:var(--muted)}
.line.on{background:var(--hl)}
.gw{border-bottom:2px dotted var(--accent);cursor:help}
.player{border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-around;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.player button{border:0;background:none;width:48px;height:48px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.player button svg{width:24px;height:24px}
.player .main{background:var(--accent);color:var(--accent-ink);width:56px;height:56px}
.player .spd{font-weight:700;font-size:.875rem;width:auto;padding:0 10px;border:1px solid var(--line);height:36px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet>div{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet .w{font-family:var(--fr);font-size:1.75rem}
.qs{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.qs li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qs .a{color:var(--good);font-weight:600}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;max-width:min(480px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.875rem;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.err{background:var(--bad);color:#fff}
.diag{font-size:.8125rem;background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Akademi (Dersler · Sınavlar · İlerleme) + düzen. Telefonda tek sütun ve alt sekmeler; geniş ekranda (≥900 px) solda kenar menü. Aynı kod. */
:root{--metin:Georgia,"Times New Roman",serif}
.screen{--ust:16px}
.screen>*{flex-shrink:0}   /* kaydırılan sütunda öğeler sıkışmasın (taşan tablo kendi içinde kaymasın) */
.nav{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:.75rem}
.nav-marka,.nav-alt{display:none}
body.genis .app{max-width:880px}
.tema{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav .tema button{justify-content:center;border:0;background:none;border-radius:7px;padding:6px 0;font-size:.75rem;font-weight:600;color:var(--muted);flex-direction:row}
.nav .tema button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
@media (min-width:900px){
  .app,body.genis .app{max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .screen{--ust:28px;--kol:640px;grid-column:2;grid-row:1;padding:var(--ust) max(32px,calc((100% - var(--kol)) / 2)) 48px}
  body.genis .screen{--kol:980px}
  #playerSlot{grid-column:2;grid-row:2}
  .nav{grid-column:1;grid-row:1/3;width:236px;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:20px 12px;overflow-y:auto}
  .nav-marka{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.0625rem;padding:2px 10px 18px}
  .nav-marka i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--fr);font-size:1.25rem}
  .nav button[data-tab]{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:.9375rem;font-weight:600}
  .nav button[data-tab]:hover{background:var(--soft);color:var(--ink)}
  .nav button[data-tab][aria-current="page"]{background:var(--hl);color:var(--accent)}
  .nav-alt{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:16px}
  .nav-hedef{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:12px;padding:12px;font-size:.8125rem}
  .nav-hedef .ak-bar{height:6px;margin:0;background:var(--line)}
  .top h1{font-size:1.5rem}
  .spacer{flex:0 0 4px}
  .sheet{left:236px}
  body.genis .bottom{flex-direction:row;flex-wrap:wrap;align-items:center}
  body.genis .bottom .big-btn{width:auto;padding:14px 28px}
}
.sm{padding:7px 11px;font-size:.875rem;border-radius:10px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.ak-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ak-unit .t{font-weight:700}
.ak-note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.9375rem}
.ak-note.ok{background:var(--good-bg)}
.ak-meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.8125rem;color:var(--muted);flex-wrap:wrap}
.ak-chip{border-radius:99px;padding:2px 9px;background:var(--soft);font-weight:600}
.ak-chip.ok{background:var(--good-bg);color:var(--good)} .ak-chip.wait{background:var(--hl);color:var(--accent)} .ak-chip.warn{background:var(--warn-bg);color:var(--warn)}
.ak-md{line-height:1.6}
.ak-md h1{font-size:1.5rem;margin:.6em 0 .3em} .ak-md h2{font-size:1.2rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:1.4em 0 .4em;padding-top:.6em;border-top:1px solid var(--line)}
.ak-md h3{font-size:1.05rem;margin:1.1em 0 .3em}
.ak-md table,.ak-tbl{border-collapse:collapse;width:100%;font-size:.9375rem;margin:.6em 0;display:block;overflow-x:auto}
.ak-md th,.ak-md td,.ak-tbl th,.ak-tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.ak-md th,.ak-tbl th{background:var(--soft)}
.ak-md blockquote{margin:.6em 0;padding:.4em 1em;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.ak-md em{font-family:var(--fr);font-size:1.08em}
.tts{text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:pointer;border-radius:4px}
.tts:hover,.tts.on{background:var(--hl)}
.ak-soru{font-size:1.0625rem;font-weight:600}
.ak-no{color:var(--accent)}
.ak-doc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:12px 14px;font-family:Georgia,serif;font-size:1.0625rem;line-height:1.55}
.say.ak-big{width:72px;height:72px} .say.ak-big svg{width:30px;height:30px} .say.on{background:var(--accent);color:var(--accent-ink)}

.ak-bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px} .ak-bar span{display:block;height:100%;background:var(--accent)}
.ak-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ak-skill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.ak-big{font-size:1.75rem;font-weight:700}

/* ===== Ders: içindekiler tek öğe. Dar ekranda üstte açılır kutu (okunan bölümün adı), 1150 px ve üstünde sağda sabit sütun ===== */
.ak-md{max-width:48rem}

.ak-ders-ic{min-width:0;display:flex;flex-direction:column;gap:12px}

.ak-toc-ac span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak-toc-ac small{color:var(--muted);font-weight:500;flex:none}

.ak-toc.acik ol{display:block}
.ak-toc li a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9375rem;line-height:1.35}
.ak-toc li a:hover{background:var(--soft)}
.ak-toc li a[aria-current="true"]{background:var(--hl);color:var(--accent);font-weight:700}
.ak-toc-bas{display:none}
@media (min-width:1150px){
  .ak-ders.tocu{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:start}
  .ak-toc{order:2;top:0;padding:0;border:0;background:none;max-height:calc(100vh - 56px);overflow:auto}
  .ak-toc-ac{display:none}
  .ak-toc-bas{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 12px}
  .ak-toc ol{display:block;margin:0;padding:0;background:none;border:0;border-left:2px solid var(--line);border-radius:0;max-height:none}
  .ak-toc li a{border-radius:0 8px 8px 0;margin-left:-2px;border-left:2px solid transparent;font-size:.875rem;padding:5px 10px}
  .ak-toc li a[aria-current="true"]{border-left-color:var(--accent)}
  .ak-md h2{scroll-margin-top:16px}
}

/* ===== Sınav ekranı (bilgisayarlı TCF'ye benzer): menü yok, üst ve alt çubuk sabit ===== */
.screen.sv-ekran{padding:0;gap:0}
.sv{flex:1 0 auto;display:flex;flex-direction:column}
.sv-ust{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 12px}
.sv-satir{display:flex;align-items:center;gap:12px}
.sv-bolum{flex:1;min-width:0}

.sv-bolum b{display:block;font-size:1.0625rem;line-height:1.25}
.sv-bolum .tr{font-weight:500;color:var(--muted);font-size:.875rem}

.sv-no{font-variant-numeric:tabular-nums;font-size:.875rem;color:var(--muted);white-space:nowrap}

.sv-sure{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--bg)}
.sv-sure small{font-size:.6875rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sv-sure b{font-size:1.375rem;font-variant-numeric:tabular-nums}
.sv-sure.az{border-color:var(--bad);color:var(--bad)}
.sv-mobil-no{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:.875rem;color:var(--muted)}
.sv-satir .sv-no,.sv-bolum .pc{display:none}
.sv-bolumler{padding-top:10px}
.sv-seg{display:flex;gap:3px;padding-top:10px}
.sv-seg i{flex:1;height:6px;border-radius:99px;background:var(--soft)}
.sv-seg i.ok{background:var(--accent);opacity:.4} .sv-seg i.su{background:var(--accent)}
.sv-pills{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
.sv-pills button{min-width:36px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-weight:600;font-variant-numeric:tabular-nums}
.sv-pills button.done{background:var(--soft)} .sv-pills button.cur{border:2px solid var(--accent);color:var(--accent)}
.sv-govde{flex:1;width:100%;max-width:860px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.sv-govde.genis{max-width:1180px}
.sv-alt{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px}
.sv-alt .bilgi{flex:1;min-width:0;font-size:.875rem;color:var(--muted)}
.sv-dug{display:flex;gap:10px;align-items:center}
.sv-dug .big-btn{width:auto;padding:14px 24px}
@media (max-width:899px){ .sv-bolum .tr{display:block} .sv-bolum .tr i{display:none} .sv-alt .bilgi{display:none} .sv-dug{flex:1} .sv-dug .big-btn{flex:1} }
@media (min-width:900px){
  .sv-ust{padding:12px 28px 14px}
  .sv-satir{gap:28px}
  .sv-bolum b{font-size:1.25rem}
  .sv-mobil-no{display:none}
  .sv-satir .sv-no{display:block} .sv-bolum .pc{display:inline}
  .sv-sure{padding:6px 14px} .sv-sure b{font-size:1.625rem}
  .sv-govde{padding:32px 28px}
  .sv-alt{padding:14px 28px}
}
.sv-dinle{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sv-dinle h2{margin:0;font-size:1.25rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.sv-dinle.yatay{flex-direction:row;text-align:left;padding:16px 20px}
.sv-kulak{width:88px;height:88px;border-radius:99px;background:var(--hl);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative}
.sv-kulak svg{width:40px;height:40px}
.sv-kulak.calar::after{content:"";position:absolute;inset:-8px;border-radius:99px;border:3px solid var(--accent);opacity:.35;animation:svdalga 1.6s ease-out infinite}
@keyframes svdalga{from{transform:scale(.9);opacity:.5}to{transform:scale(1.25);opacity:0}}
.sv-ses{width:100%;max-width:420px;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:.875rem;color:var(--muted)}
.sv-ses .c{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.sv-ses .c span{display:block;width:0;height:100%;background:var(--accent);transition:width .25s linear}
.sv-bekle{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.sv-dinlendi{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9375rem}
.sv-dinlendi .tik{width:26px;height:26px;border-radius:99px;background:var(--good-bg);color:var(--good);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
/* Sınav ve yazmadaki Fransızca metin Georgia ile: Instrument Serif'te tire çok açık görünüyor (c'est - à - dire) */
.sv-soru,.ak-opt,.ak-doc,.sv-gorev .ak-md{font-variant-numeric:lining-nums}
.sv-soru{font-family:var(--metin);font-size:1.375rem;line-height:1.35;margin:4px 0 0}
.ak-opts{display:flex;flex-direction:column;gap:10px}
.ak-opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-family:var(--metin);font-size:1.125rem;line-height:1.35}
.ak-opt:hover:not(:disabled){border-color:var(--muted)}
.ak-opt[aria-checked="true"]{border-color:var(--accent);background:var(--hl)}
.ak-let{font-family:var(--ui);font-size:.9375rem;font-weight:700;width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ak-opt[aria-checked="true"] .ak-let{background:var(--accent);color:var(--accent-ink)}
.sv-okuma{display:flex;flex-direction:column;gap:18px}
.sv-sag{display:flex;flex-direction:column;gap:16px}
.sv-belge{padding:20px 22px}
.ak-doc>:first-child{margin-top:0} .ak-doc>:last-child{margin-bottom:0}
@media (min-width:900px){ .sv-okuma{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start} }
.ak-chip.bad{background:var(--bad-bg);color:var(--bad)}

/* ===== Yazma (EE): görev, sayım kuralı, harf düğmeleri, canlı sayaç ve sınır ölçeği ===== */
.sv-gorevler{display:flex;gap:6px;flex-wrap:wrap}
.sv-gorevler button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.875rem;display:flex;gap:8px;align-items:center}
.sv-gorevler button small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.sv-gorevler button[aria-selected="true"]{border:2px solid var(--accent);color:var(--accent)}
.sv-yazma{display:flex;flex-direction:column;gap:16px}
.sv-sol{display:flex;flex-direction:column;gap:14px}
.sv-gorev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sv-gorev .ak-md{font-family:var(--metin);font-size:1.0625rem;line-height:1.5}
.sv-gorev .ak-md p{margin:.3em 0}
.sv-gorev .ak-md blockquote{font-family:var(--ui);font-size:.9375rem;line-height:1.5}
.sv-trac{display:none;font-family:var(--ui)}
.sv-sinir{display:inline-flex;background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.875rem;font-variant-numeric:tabular-nums}
.sv-kural{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.875rem}
.sv-kural b{display:block;margin-bottom:4px;font-size:.9375rem}
.sv-kural ul{margin:6px 0 0;padding-left:1.1em} .sv-kural li{margin:2px 0}
.sv-kural .f{font-family:var(--metin);font-size:1.05em}
.sv-editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sv-harfler{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sv-harfler span{font-size:.75rem;color:var(--muted);align-self:center;margin-right:4px}
.sv-harfler button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:1.0625rem;padding:0 6px}
.sv-harfler button:hover{border-color:var(--accent);color:var(--accent)}
.sv-editor textarea{display:block;width:100%;min-height:260px;border:0;resize:vertical;padding:14px 16px;font:inherit;font-size:1.0625rem;line-height:1.6;background:var(--surface);color:var(--ink)}
.sv-editor textarea:focus{outline:none}
.sv-kelimeler{padding:14px 16px;font-size:1.0625rem;line-height:2;min-height:260px;white-space:pre-wrap}
.sv-kelimeler span{border-radius:4px;padding:1px 2px;background:var(--hl)}
.sv-kelimeler span:nth-of-type(even){background:var(--warn-bg)}
.sv-kelimeler span.x{background:none;color:var(--muted)}
.sv-sayac{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.sv-sayac-ust{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sv-sayac-ust .n{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sv-sayac-ust .ak-chip{margin-left:auto}
.sv-olcek{position:relative;height:12px;border-radius:99px;background:var(--soft);margin:4px 0 18px}
.sv-olcek .bolge{position:absolute;top:0;bottom:0;background:var(--good-bg);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.sv-olcek .dolu{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:99px;background:var(--accent);transition:width .15s}
.sv-olcek .dolu.az{background:var(--warn)} .sv-olcek .dolu.fazla{background:var(--bad)}
.sv-olcek .et{position:absolute;top:15px;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.sv-mesaj{font-size:.875rem}
.sv-mesaj.ok{color:var(--good)} .sv-mesaj.az{color:var(--warn)} .sv-mesaj.fazla{color:var(--bad);font-weight:600}
.sv-sayac-alt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted)}
.sv-sayac-alt .link{padding:0}
/* Telefon: görev, yazı alanı, sayım kuralı sırasıyla (yazı alanı ilk ekranda görünsün) */
@media (max-width:899px){
  .sv-yazma .sv-sol{display:contents}
  .sv-gorev{order:1;padding:14px 16px} .sv-editor{order:2} .sv-kural{order:3}
  .sv-trac{display:inline;padding:0} .sv-gorev:not(.tr-acik) .ak-md blockquote{display:none}
  .sv-gorevler{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px}
  .sv-gorevler button{flex:none;padding:6px 10px}
}
@media (min-width:900px){
  .sv-yazma{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;align-items:start}
  .sv-editor textarea,.sv-kelimeler{min-height:360px}
}

/* ===== Bugün (Tekrar sekmesinin ana ekranı): plan, tek Başla, işler; PC'de sağda kartlar ve ek çalışma ===== */
.bg-top{flex-wrap:wrap;row-gap:4px}
.bg-top h1{font-size:1.5rem}
.bg-tarih{color:var(--muted);font-size:.9375rem}
.bg-top .ak-chip{font-size:.8125rem}
.bg-izgara{display:flex;flex-direction:column;gap:16px}
.bg-sol,.bg-sag{display:flex;flex-direction:column;gap:16px;min-width:0}
.bg-sag .panel{gap:12px}

.bg-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bg-ust h2{margin:0;font-size:1.25rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.bg-ilerle{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bg-ilerle span{display:block;height:100%;background:var(--good)}
.bg-not{background:var(--warn-bg);border-radius:12px;padding:12px 14px;font-size:.9375rem}
.bg-sor{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--hl);border-radius:12px;padding:10px 12px;font-size:.9375rem}
.bg-basla{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 18px;text-align:left}
.bg-basla .o{width:40px;height:40px;border-radius:99px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;flex:none}
.bg-basla b{display:block;font-size:1.125rem}
.bg-basla small{display:block;opacity:.88;font-size:.875rem}
.bg-basla em,.bg-is em{font-family:var(--fr);font-size:1.1em}
.bg-b{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 -8px}
.bg-isler{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bg-isler li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px 10px 12px;border-top:1px solid var(--line)}
.bg-isler li:first-child{border-top:0}
.bg-isler li.sira{background:var(--hl)}
.bg-d{width:30px;height:30px;border-radius:99px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.8125rem;color:var(--muted);padding:0}

.bg-isler li.sira .bg-d{border-color:var(--accent);color:var(--accent)}

.bg-is .t{font-weight:600;line-height:1.3}
.bg-isler li.bitti .bg-is .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.bg-is .s{font-size:.8125rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bg-tur{font-size:.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--muted)}
.bg-tur.ders{background:var(--hl);color:var(--accent)} .bg-tur.kart{background:var(--warn-bg);color:var(--warn)} .bg-tur.alistirma{background:var(--good-bg);color:var(--good)}

.bg-isler .dk{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.bg-serit div{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:.6875rem;color:var(--muted);display:flex;flex-direction:column}

.bg-serit .ok{background:var(--good-bg);border-color:var(--good-bg);color:var(--good)}
.bg-serit .bu{border:2px solid var(--accent);color:var(--accent)} .bg-serit .bu b{color:var(--accent)}
.bg-plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.875rem}
.bg-plan li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.bg-plan li b{color:var(--muted)} .bg-plan li.bu b{color:var(--accent)}
@media (min-width:900px){
  .bg-izgara{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
  .bg-top h1{font-size:2rem}
}

/* ===== Ders biçimi (Adım 4): Fikir → Çözümlü örnek → Kural → Kendini dene kutuları ===== */
.ak-blok{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:14px;padding:12px 18px 14px;margin:14px 0}
.ak-blok>.ak-etiket{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border-radius:99px;padding:2px 10px;margin:0 0 4px;background:var(--soft);color:var(--ink)}
.ak-blok.fikir{border-left-color:var(--warn)} .ak-blok.fikir>.ak-etiket{background:var(--warn-bg);color:var(--warn)}
.ak-blok.ornek{border-left-color:var(--accent)} .ak-blok.ornek>.ak-etiket{background:var(--hl);color:var(--accent)}
.ak-blok.kural{border-left-color:var(--ink)}
.ak-blok.dene{border-left-color:var(--good)} .ak-blok.dene>.ak-etiket{background:var(--good-bg);color:var(--good)}

t vous ? Vous êtes turc ?","Ya siz? Türk müsünüz?","marc"],["Oui, je suis turc. Je m'appelle Kerem.","Evet, Türküm. Benim adım Kerem.","kerem"],["Enchanté !","Memnun oldum!","marc"]],"gloss":[["voici","işte, bu (tanıştırırken)"],["gentille","nazik (dişil)"],["brésilienne","Brezilyalı (dişil)"]],"qs":[["Marc nereli ve mesleği ne?","Kanadalı, mühendis."],["Ana'nın mesleği ne?","Hemşire."],["Kerem nereli?","Türk."]],"kind":"Günlük hayat","speakers":{"marc":{"voice":"tom","label":"Marc"},"kerem":{"voice":"pierre","label":"Kerem"}}},{"u":1,"title":"Ils sont fatigués","tr_title":"Onlar yorgun","lines":[["Paul et Julie sont médecins.","Paul ve Julie doktor.","n"],["Ils sont très fatigués.","Çok yorgunlar.","n"],["Julie est française.","Julie Fransız.","n"],["Paul est québécois.","Paul Québecli.","n"],["Il est grand et sympathique.","Uzun boylu ve sevimli.","n"],["Julie n'est pas grande. Elle est petite.","Julie uzun değil. Kısa boylu.","n"],["Ils ne sont pas mariés.","Evli değiller.","n"],["Ils sont amis.","Arkadaşlar.","n"],["Et toi ? Tu es fatigué ?","Ya sen? Yorgun musun?","n"],["Non, je ne suis pas fatigué. Je suis content !","Hayır, yorgun değilim. Mutluyum!","ami"]],"gloss":[["sympathique","sevimli, cana yakın"],["marié(e)s","evli"],["content","memnun, mutlu"]],"qs":[["Paul ve Julie'nin mesleği ne?","Doktor."],["Julie nasıl biri (boy)?","Kısa boylu."],["Paul ve Julie evli mi?","Hayır, arkadaşlar."]],"kind":"Günlük hayat","speakers":{"ami":{"voice":"pierre","label":"Un ami"}}},{"u":2,"title":"La famille de Leila","tr_title":"Leila'nın ailesi","lines":[["Leila a trente-quatre ans.","Leila otuz dört yaşında.","n"],["Elle a un mari, Karim, et deux enfants.","Bir kocası, Karim, ve iki çocuğu var.","n"],["Les enfants s'appellent Adam et Sara.","Çocukların adı Adam ve Sara.","n"],["Adam a huit ans et Sara a cinq ans.","Adam sekiz, Sara beş yaşında.","n"],["La famille a une petite maison.","Ailenin küçük bir evi var.","n"],["Dans la maison, il y a trois chambres et une cuisine.","Evde üç yatak odası ve bir mutfak var.","n"],["Il y a aussi un jardin.","Bir de bahçe var.","n"],["Leila n'a pas de voiture, mais Karim a une voiture.","Leila'nın arabası yok ama Karim'in arabası var.","n"],["Ils ont un chat. Le chat a deux ans.","Bir kedileri var. Kedi iki yaşında.","n"]],"gloss":[["dans","içinde"],["la chambre","yatak odası"],["le jardin","bahçe"],["aussi","de, da, ayrıca"],["mais","ama"]],"qs":[["Leila kaç yaşında?","34."],["Evde kaç yatak odası var?","Üç."],["Kimin arabası var?","Karim'in."]],"kind":"Günlük hayat","speakers":{}},{"u":2,"title":"À l'usine","tr_title":"Fabrikada","lines":[["Il y a une usine à Laval.","Laval'de bir fabrika var.","n"],["Dans l'usine, il y a quarante machines et soixante employés.","Fabrikada kırk makine ve altmış çalışan var.","n"],["Il y a un bureau et une cafétéria.","Bir ofis ve bir kafeterya var.","n"],["Le chef s'appelle Monsieur Roy.","Şefin adı Bay Roy.","n"],["Il a cinquante-deux ans.","Elli iki yaşında.","n"],["Il a un ordinateur et un téléphone.","Bir bilgisayarı ve bir telefonu var.","n"],["Aujourd'hui, il y a un problème.","Bugün bir sorun var.","n"],["Il n'y a pas de café dans la cafétéria !","Kafeteryada kahve yok!","n"],["Les employés ne sont pas contents.","Çalışanlar memnun değil.","n"]],"gloss":[["l'employé(e)","çalışan"],["le chef","şef, amir"],["l'ordinateur","bilgisayar"],["aujourd'hui","bugün"]],"qs":[["Fabrikada kaç makine var?","Kırk."],["Bay Roy kaç yaşında?","52."],["Bugünkü sorun ne?","Kafeteryada kahve yok."]],"kind":"Günlük hayat","speakers":{}},{"u":3,"title":"Une journée de travail","tr_title":"Bir iş günü","lines":[["Je m'appelle Sophie. Je travaille dans une usine.","Benim adım Sophie. Bir fabrikada çalışıyorum.","n"],["Je commence à sept heures et je termine à quinze heures trente.","Yedide başlıyorum ve on beş otuzda bitiriyorum.","n"],["Le matin, je vérifie les machines.","Sabah makineleri kontrol ediyorum.","n"],["À midi, nous mangeons ensemble à la cafétéria.","Öğlen kafeteryada birlikte yemek yiyoruz.","n"],["L'après-midi, je répare les machines avec mon équipe.","Öğleden sonra ekibimle makineleri tamir ediyorum.","n"],["Mon collègue Marc programme les robots.","İş arkadaşım Marc robotları programlıyor.","n"],["Le soir, je cuisine et mon mari regarde la télé.","Akşam yemek yapıyorum, kocam televizyon izliyor.","n"],["Le samedi, nous jouons au soccer avec nos enfants.","Cumartesileri çocuklarımızla futbol oynuyoruz.","n"],["Le dimanche, nous restons à la maison.","Pazarları evde kalıyoruz.","n"]],"gloss":[["le collègue","iş arkadaşı"],["l'équipe","ekip"]],"qs":[["Sophie saat kaçta başlıyor, kaçta bitiriyor?","7'de başlıyor, 15:30'da bitiriyor."],["Marc ne yapıyor?","Robotları programlıyor."],["Cumartesileri ne yapıyorlar?","Çocuklarıyla futbol oynuyorlar."]],"kind":"Günlük hayat","speakers":{}},{"u":3,"title":"Où est la clé ?","tr_title":"Anahtar nerede?","lines":[["Il est huit heures moins le quart.","Saat sekize çeyrek var.","n"],["Thomas cherche sa clé.","Thomas anahtarını arıyor.","n"],["Chérie, tu as ma clé ?","Hayatım, anahtarım sende mi?","thomas"],["Non, je n'ai pas ta clé. Elle n'est pas dans la cuisine ?","Hayır, anahtarın bende değil. Mutfakta değil mi?","femme"],["Non. Je cherche, je cherche... Je ne trouve pas la clé !","Hayır. Arıyorum, arıyorum... Anahtarı bulamıyorum!","thomas"],["Regarde dans ta poche !","Cebine bak!","femme"],["Ah ! Voilà ! La clé est dans ma poche.","Aa! İşte! Anahtar cebimde.","thomas"],["Bon, il est huit heures. Tu arrives en retard !","Peki, saat sekiz. Geç kalıyorsun!","femme"]],"gloss":[["chérie","hayatım, canım"],["regarde !","bak!"],["la poche","cep"],["en retard","geç"]],"qs":[["Hikaye başında saat kaç?","7:45."],["Thomas ne arıyor?","Anahtarını."],["Anahtar nerede?","Thomas'ın cebinde."]],"kind":"Günlük hayat","speakers":{"thomas":{"voice":"tom","label":"Thomas"},"femme":{"voice":"jessica","label":"Sa femme"}}},{"u":4,"title":"Le week-end de Nadia","tr_title":"Nadia'nın hafta sonu","lines":[["Nadia vient du Liban.","Nadia Lübnan'dan geliyor.","n"],["Maintenant, elle habite à Ottawa.","Şimdi Ottawa'da yaşıyor.","n"],["Ce week-end, il va faire beau.","Bu hafta sonu hava güzel olacak.","n"],["Samedi matin, elle va au marché à vélo.","Cumartesi sabah pazara bisikletle gidiyor.","n"],["L'après-midi, elle va au parc avec ses enfants.","Öğleden sonra çocuklarıyla parka gidiyor.","n"],["Le soir, son amie Julie vient à la maison.","Akşam arkadaşı Julie eve geliyor.","n"],["Elles vont faire la cuisine ensemble.","Birlikte yemek yapacaklar.","n"],["Dimanche, il va pleuvoir.","Pazar yağmur yağacak.","n"],["Nadia ne va pas sortir.","Nadia dışarı çıkmayacak.","n"],["Elle va faire le ménage et regarder un film.","Ev temizliği yapacak ve film izleyecek.","n"]],"gloss":[["le Liban","Lübnan"],["sortir","dışarı çıkmak"]],"qs":[["Nadia nereli, nerede yaşıyor?","Lübnan'dan, Ottawa'da yaşıyor."],["Cumartesi sabah pazara nasıl gidiyor?","Bisikletle."],["Pazar neden dışarı çıkmıyor?","Yağmur yağacak."]],"kind":"Günlük hayat","speakers":{}},{"u":4,"title":"Un voyage à Québec","tr_title":"Québec'e bir yolculuk","lines":[["Qu'est-ce que tu fais la semaine prochaine ?","Gelecek hafta ne yapıyorsun?","claire"],["Je vais à Québec avec mon mari.","Kocamla Québec'e gidiyorum.","emma"],["Ah oui ? Comment est-ce que vous allez à Québec ?","Öyle mi? Québec'e nasıl gidiyorsunuz?","claire"],["En train. Ça prend trois heures.","Trenle. Üç saat sürüyor.","emma"],["Il va faire froid là-bas !","Orada hava soğuk olacak!","claire"],["Oui, il va neiger. Mais nous adorons la neige.","Evet, kar yağacak. Ama karı çok severiz.","emma"],["Vous allez visiter la vieille ville ?","Eski şehri gezecek misiniz?","claire"],["Oui, et nous allons manger au restaurant.","Evet, bir de restoranda yemek yiyeceğiz.","emma"],["Bon voyage !","İyi yolculuklar!","claire"]],"gloss":[["le voyage","yolculuk"],["là-bas","orada"],["visiter","gezmek"],["la vieille ville","eski şehir"]],"qs":[["Québec'e kiminle gidiyor?","Kocasıyla."],["Nasıl gidiyorlar, ne kadar sürüyor?","Trenle, üç saat."],["Orada hava nasıl olacak?","Soğuk, kar yağacak."]],"kind":"Günlük hayat","speakers":{"claire":{"voice":"jessica","label":"Claire"},"emma":{"voice":"siwis","label":"Emma"}}},{"u":5,"title":"À la boulangerie","tr_title":"Fırında","lines":[["Il est huit heures. Marc entre dans la boulangerie.","Saat sekiz. Marc fırına giriyor.","n"],["Bonjour, monsieur !","Günaydın, beyefendi!","bou"],["Bonjour ! Je voudrais une baguette et deux croissants, s'il vous plaît.","Günaydın! Bir baget ve iki kruvasan istiyorum, lütfen.","marc"],["Voilà. Avec ça ?","Buyurun. Başka?","bou"],["Est-ce que vous avez du gâteau au chocolat ?","Çikolatalı pastanız var mı?","marc"],["Oui. Vous voulez un morceau ?","Evet. Bir dilim ister misiniz?","bou"],["Oui, merci. C'est tout. Ça fait combien ?","Evet, teşekkürler. Bu kadar. Ne kadar tuttu?","marc"],["Ça fait neuf dollars cinquante.","Dokuz dolar elli.","bou"],["Je peux payer par carte ?","Kartla ödeyebilir miyim?","marc"],["Bien sûr. Merci et bonne journée !","Tabii ki. Teşekkürler, iyi günler!","bou"]],"gloss":[["entrer dans","-e girmek"],["au chocolat","çikolatalı"],["un morceau","bir parça, dilim"]],"qs":[["Marc ne istiyor? (ilk istek)","Bir baget ve iki kruvasan."],["Başka ne alıyor?","Bir dilim çikolatalı pasta."],["Toplam ne kadar, nasıl ödüyor?","9,50 $, kartla."]],"kind":"Günlük hayat","speakers":{"bou":{"voice":"jessica","label":"La boulangère"},"marc":{"voice":"tom","label":"Marc"}}},{"u":5,"title":"Un dîner entre amis","tr_title":"Arkadaşlarla akşam yemeği","lines":[["Samedi soir, nos amis viennent à la maison pour le dîner.","Cumartesi akşamı arkadaşlarımız akşam yemeğine bize geliyor.","n"],["Je dois faire les courses.","Alışveriş yapmalıyım.","n"],["Mon mari, Osman, ne peut pas venir avec moi : il doit travailler.","Kocam Osman benimle gelemiyor: çalışması gerekiyor.","n"],["Je vais au supermarché.","Süpermarkete gidiyorum.","n"],["J'achète du poisson, du riz, des tomates et des légumes.","Balık, pirinç, domates ve sebze alıyorum.","n"],["J'achète aussi un kilo de pommes et deux bouteilles de jus d'orange.","Bir kilo elma ve iki şişe portakal suyu da alıyorum.","n"],["Je n'achète pas de viande, parce que notre amie Sara ne mange pas de viande.","Et almıyorum, çünkü arkadaşımız Sara et yemiyor.","n"],["À la caisse, ça fait quatre-vingt-trois dollars quarante.","Kasada 83,40 dolar tutuyor.","n"],["C'est cher ! Je paie par carte.","Pahalı! Kartla ödüyorum.","n"],["Le soir, je vais faire la cuisine et Osman va faire un gâteau.","Akşam ben yemek yapacağım, Osman da pasta yapacak.","n"]],"gloss":[["le dîner","akşam yemeği"],["pour","için"],["je paie","ödüyorum (payer)"]],"qs":[["Kimler, ne için geliyor?","Arkadaşlar, akşam yemeği için."],["Neden et almıyor?","Sara et yemiyor."],["Akşam Osman ne yapacak?","Pasta yapacak."]],"kind":"Günlük hayat","speakers":{}},{"u":5,"kind":"Klasik","title":"Le Corbeau et le Renard","tr_title":"Karga ile Tilki (La Fontaine)","lines":[["Un corbeau est sur un arbre.","Bir karga bir ağacın üstünde.","n"],["Il a un grand morceau de fromage.","Büyük bir parça peyniri var.","n"],["Un renard passe. Il a faim.","Bir tilki geçiyor. Karnı aç.","n"],["Le renard veut le fromage, mais il ne peut pas monter dans l'arbre.","Tilki peyniri istiyor ama ağaca çıkamıyor.","n"],["Alors, il dit :","Bunun üzerine diyor ki:","n"],["« Bonjour, Monsieur du Corbeau ! Vous êtes très beau ! »","\"Günaydın Karga Bey! Çok yakışıklısınız!\"","renard"],["« Vous chantez bien aussi ? Je veux écouter votre voix ! »","\"Güzel şarkı da söylüyor musunuz? Sesinizi dinlemek istiyorum!\"","renard"],["Le corbeau est très content. Il ouvre son bec pour chanter.","Karga çok memnun. Şarkı söylemek için gagasını açıyor.","n"],["Le fromage tombe. Le renard prend le fromage.","Peynir düşüyor. Tilki peyniri alıyor.","n"],["« Merci, monsieur ! Il ne faut pas écouter les flatteurs ! »","\"Teşekkürler, bayım! Dalkavukları dinlememek lazım!\"","renard"]],"gloss":[["arbre","ağaç"],["renard","tilki"],["corbeau","karga"],["passe","geçiyor (passer)"],["monter","çıkmak"],["dit","der, söyler (dire)"],["beau","yakışıklı, güzel"],["chantez","şarkı söylüyorsunuz (chanter)"],["voix","ses"],["ouvre","açıyor (ouvrir)"],["bec","gaga"],["tombe","düşüyor (tomber)"],["prend","alıyor (prendre)"],["flatteurs","dalkavuklar"]],"qs":[["Karganın neyi var?","Büyük bir parça peynir."],["Tilki neden peyniri kendisi alamıyor?","Ağaca çıkamıyor."],["Karga neden gagasını açıyor?","Tilki onu övdü; şarkı söylemek istiyor."]],"speakers":{"renard":{"voice":"tom","label":"Le renard"}}},{"u":5,"kind":"Gerçek metin","title":"Message de la pharmacie","tr_title":"Eczaneden sesli mesaj","lines":[["Bonjour, ici la pharmacie du Centre.","Merhaba, burası Merkez Eczanesi.","ph"],["C'est un message pour madame Bulut.","Bu mesaj Bulut Hanım için.","ph"],["Votre commande est prête.","Siparişiniz hazır.","ph"],["Vous pouvez venir demain, entre neuf heures et dix-huit heures.","Yarın saat dokuz ile on sekiz arasında gelebilirsiniz.","ph"],["Ça coûte vingt-quatre dollars cinquante.","Tutarı 24,50 dolar.","ph"],["Vous devez apporter votre carte d'assurance maladie.","Sağlık sigortası kartınızı getirmelisiniz.","ph"],["Merci et bonne journée !","Teşekkürler, iyi günler!","ph"]],"gloss":[["ici","burası"],["commande","sipariş"],["prête","hazır (dişil)"],["entre","arasında"],["apporter","getirmek"],["carte d'assurance maladie","sağlık sigortası kartı"]],"qs":[["Mesaj kimden ve kime?","Merkez Eczanesi'nden Bulut Hanım'a."],["Ne zaman gidebilir?","Yarın, 9:00 ile 18:00 arasında."],["Ne kadar ödeyecek ve ne götürmeli?","24,50 $; sağlık sigortası kartını götürmeli."]],"speakers":{"ph":{"voice":"jessica","label":""}}},{"u":6,"kind":"Klasik","title":"Mange, mon manteau !","tr_title":"Ye kürküm ye (Nasreddin Hoca)","speakers":{"hoca":{"voice":"tom","label":"Nasreddin Hoca"},"hote":{"voice":"pierre","label":"Ev sahibi"}},"lines":[["Un jour, un voisin riche a invité Nasreddin Hodja à un dîner.","Bir gün zengin bir komşu Nasreddin Hoca'yı akşam yemeğine davet etti.","n"],["Ce jour-là, Nasreddin a travaillé dans son jardin.","O gün Nasreddin bahçesinde çalıştı.","n"],["Il n'a pas changé ses vieux vêtements.","Eski elbiselerini değiştirmedi.","n"],["Au dîner, personne n'a parlé avec lui.","Yemekte kimse onunla konuşmadı.","n"],["Il n'a pas eu de soupe, il n'a pas eu de pain.","Ne çorba geldi ne ekmek.","n"],["Alors, il a quitté la fête.","Bunun üzerine davetten ayrıldı.","n"],["Chez lui, il a mis son beau manteau de fourrure.","Evinde güzel kürkünü giydi.","n"],["Une heure après, il a frappé à la porte.","Bir saat sonra kapıyı çaldı.","n"],["« Bienvenue, Nasreddin Hodja ! Voici la meilleure place ! »","\"Hoş geldiniz Nasreddin Hoca! İşte en iyi yer!\"","hote"],["Cette fois, tout le monde a parlé avec lui.","Bu sefer herkes onunla konuştu.","n"],["On a apporté une grande assiette de soupe.","Büyük bir tabak çorba getirdiler.","n"],["Alors, Nasreddin a mis sa manche dans la soupe.","Bunun üzerine Nasreddin yenini çorbaya batırdı.","n"],["« Mange, mon manteau, mange ! »","\"Ye kürküm ye!\"","hoca"],["« Mais Hodja, qu'est-ce que vous faites ? »","\"Ama Hocam, ne yapıyorsunuz?\"","hote"],["« Vous avez invité mon manteau, pas moi ! »","\"Siz kürkümü davet ettiniz, beni değil!\"","hoca"]],"gloss":[["un voisin","komşu"],["riche","zengin"],["les vêtements","elbiseler"],["personne","kimse"],["quitter","ayrılmak"],["la fête","davet, parti"],["le manteau de fourrure","kürk"],["frapper à la porte","kapıyı çalmak"],["la meilleure place","en iyi yer"],["une assiette","tabak"],["la manche","yen, kol"],["cette fois","bu sefer"]],"qs":[["İlk gelişinde neden kimse onunla ilgilenmedi?","Eski iş elbiseleriyle gelmişti."],["Davetten ayrılınca ne yaptı?","Evinde güzel kürkünü giydi ve bir saat sonra geri geldi."],["Neden \"Ye kürküm ye\" dedi?","Çünkü insanlar ona değil, kürküne değer verdi."]]},{"u":6,"kind":"Günlük hayat","title":"Chez le médecin","tr_title":"Doktorda","speakers":{"doc":{"voice":"jessica","label":"La médecin"},"kerem":{"voice":"tom","label":"Kerem"}},"lines":[["Kerem a un rendez-vous chez le médecin à dix heures.","Kerem'in saat onda doktordan randevusu var.","n"],["Bonjour, monsieur. Qu'est-ce qui ne va pas ?","Merhaba beyefendi. Neyiniz var?","doc"],["J'ai mal à la tête et à la gorge.","Başım ve boğazım ağrıyor.","kerem"],["Depuis quand ?","Ne zamandan beri?","doc"],["Depuis hier. Hier soir, j'ai eu de la fièvre.","Dünden beri. Dün akşam ateşim çıktı.","kerem"],["Vous avez pris un médicament ?","İlaç aldınız mı?","doc"],["Oui, j'ai pris du paracétamol, mais je n'ai pas bien dormi.","Evet, parasetamol aldım ama iyi uyuyamadım.","kerem"],["Est-ce que vous avez mangé ce matin ?","Bu sabah bir şey yediniz mi?","doc"],["Non, je n'ai rien mangé. J'ai seulement bu du thé.","Hayır, hiçbir şey yemedim. Sadece çay içtim.","kerem"],["Bon, ouvrez la bouche… Vous avez un gros rhume.","Peki, ağzınızı açın… Ağır bir soğuk algınlığınız var.","doc"],["Vous devez boire beaucoup d'eau et rester à la maison deux jours.","Bol su içmeli ve iki gün evde kalmalısınız.","doc"],["Est-ce que je peux travailler demain ?","Yarın çalışabilir miyim?","kerem"],["Non, vous ne pouvez pas travailler demain. Voici votre ordonnance.","Hayır, yarın çalışamazsınız. İşte reçeteniz.","doc"],["Merci, docteur. Au revoir !","Teşekkürler doktor. Hoşça kalın!","kerem"]],"gloss":[["depuis quand","ne zamandan beri"],["la fièvre","ateş"],["rien","hiçbir şey"],["seulement","sadece"],["ouvrez la bouche","ağzınızı açın"],["un gros rhume","ağır soğuk algınlığı"],["rester","kalmak"],["l'ordonnance","reçete"]],"qs":[["Kerem'in nesi ağrıyor?","Başı ve boğazı."],["Dün akşam ne oldu, ne yaptı?","Ateşi çıktı; parasetamol aldı ama iyi uyuyamadı."],["Doktor ne söylüyor?","Bol su içmeli, iki gün evde kalmalı; yarın çalışamaz."]]},{"u":6,"kind":"Gerçek metin","title":"Courriel de l'école","tr_title":"Okuldan e-posta","speakers":{},"lines":[["Objet : Sortie au musée des sciences","Konu: Bilim müzesi gezisi","n"],["Chers parents,","Sevgili veliler,","n"],["Hier, nous avons visité le musée des sciences avec la classe de deuxième année.","Dün ikinci sınıfla bilim müzesini gezdik.","n"],["Les enfants ont vu des dinosaures et ils ont posé beaucoup de questions.","Çocuklar dinozorlar gördü ve çok soru sordular.","n"],["À midi, nous avons mangé au parc.","Öğlen parkta yemek yedik.","n"],["Trois enfants ont oublié leur repas, alors nous avons partagé nos sandwichs.","Üç çocuk yemeğini unuttu, biz de sandviçlerimizi paylaştık.","n"],["Malheureusement, Léo a perdu son sac bleu au musée.","Maalesef Léo müzede mavi çantasını kaybetti.","n"],["Est-ce que vous avez trouvé un sac bleu à la maison ?","Evde mavi bir çanta buldunuz mu?","n"],["Rappel : vendredi, les enfants doivent apporter une photo de famille.","Hatırlatma: cuma günü çocuklar bir aile fotoğrafı getirmeli.","n"],["Merci et bonne semaine !","Teşekkürler, iyi haftalar!","n"],["Madame Tremblay, enseignante de deuxième année","Tremblay Hanım, ikinci sınıf öğretmeni","n"]],"gloss":[["l'objet","konu"],["la sortie","gezi"],["chers parents","sevgili veliler"],["poser une question","soru sormak"],["le repas","yemek, öğün"],["partager","paylaşmak"],["malheureusement","maalesef"],["le rappel","hatırlatma"],["apporter","getirmek"],["l'enseignante","öğretmen (kadın)"]],"qs":[["Sınıf dün nereye gitti, ne gördü?","Bilim müzesine gitti; dinozorlar gördüler."],["Öğlen ne oldu?","Parkta yediler; üç çocuk yemeğini unuttu, sandviçleri paylaştılar."],["Öğretmen velilerden ne istiyor?","Mavi çantayı bulan haber versin; cuma çocuklar bir aile fotoğrafı getirsin."]]},{"u":7,"kind":"Klasik","title":"La Cigale et la Fourmi","tr_title":"Ağustosböceği ile Karınca (La Fontaine)","speakers":{"cigale":{"voice":"jessica","label":"La cigale"},"fourmi":{"voice":"tom","label":"La fourmi"}},"lines":[["Tout l'été, la cigale a chanté au soleil.","Bütün yaz ağustosböceği güneşte şarkı söyledi.","n"],["La fourmi, elle, a travaillé tous les jours.","Karınca ise her gün çalıştı.","n"],["Elle est sortie tôt le matin et elle est rentrée tard le soir.","Sabah erken çıktı, akşam geç döndü.","n"],["« Pourquoi est-ce que tu travailles ? Il fait beau ! »","\"Neden çalışıyorsun? Hava güzel!\"","cigale"],["« Je prépare l'hiver. »","\"Kışa hazırlanıyorum.\"","fourmi"],["En septembre, les feuilles sont tombées.","Eylülde yapraklar düştü.","n"],["En décembre, la neige est arrivée.","Aralıkta kar geldi.","n"],["La cigale n'a pas mangé depuis trois jours.","Ağustosböceği üç gündür yemek yemedi.","n"],["Alors, elle est allée chez sa voisine, la fourmi.","Bunun üzerine komşusu karıncanın evine gitti.","n"],["« J'ai faim. Tu peux me donner un peu de nourriture ? »","\"Açım. Bana biraz yiyecek verebilir misin?\"","cigale"],["« Qu'est-ce que tu as fait cet été ? »","\"Bu yaz ne yaptın?\"","fourmi"],["« J'ai chanté, jour et nuit ! »","\"Gece gündüz şarkı söyledim!\"","cigale"],["« Tu as chanté ? Eh bien, maintenant, danse ! »","\"Şarkı mı söyledin? Peki, şimdi de dans et!\"","fourmi"],["Et la cigale est partie dans le froid.","Ve ağustosböceği soğuğa çıkıp gitti.","n"]],"gloss":[["la cigale","ağustosböceği"],["la fourmi","karınca"],["l'été","yaz"],["chanter","şarkı söylemek"],["rentrer","eve dönmek"],["préparer","hazırlamak"],["l'hiver","kış"],["les feuilles","yapraklar"],["la neige","kar"],["sa voisine","komşusu (kadın)"],["j'ai faim","açım"],["la nourriture","yiyecek"],["jour et nuit","gece gündüz"],["eh bien","peki, öyleyse"],["le froid","soğuk"]],"qs":[["Yazın ağustosböceği ve karınca ne yaptı?","Ağustosböceği şarkı söyledi; karınca her gün çalıştı."],["Ağustosböceği aralıkta neden karıncaya gitti?","Kar gelmişti ve üç gündür yemek yememişti; yiyecek istedi."],["Hikâyedeki hangi geçmiş zaman fiilleri être ile kurulmuş?","est sortie, est rentrée, sont tombées, est arrivée, est allée, est partie: hepsi yer ya da durum değişikliği."]]},{"u":7,"kind":"Günlük hayat","title":"Au café","tr_title":"Kafede","speakers":{"serveur":{"voice":"pierre","label":"Le serveur"},"ilknur":{"voice":"jessica","label":"Ilknur"}},"lines":[["Samedi matin, Ilknur est entrée dans un petit café de Montréal.","Cumartesi sabahı Ilknur Montréal'de küçük bir kafeye girdi.","n"],["Bonjour madame ! Sur place ou à emporter ?","Günaydın hanımefendi! Burada mı, götürmek için mi?","serveur"],["Sur place, s'il vous plaît.","Burada, lütfen.","ilknur"],["Qu'est-ce que vous prenez ?","Ne alırsınız?","serveur"],["Pour moi, un café au lait et un croissant.","Bana bir sütlü kahve ve bir kruvasan.","ilknur"],["Vous êtes pressée aujourd'hui ?","Bugün aceleniz var mı?","serveur"],["Non, pas aujourd'hui ! En semaine, je me lève à six heures et je me dépêche toujours.","Hayır, bugün yok! Hafta içi altıda kalkıyorum ve hep acele ediyorum.","ilknur"],["Mais le samedi, je me réveille tard et je me repose.","Ama cumartesileri geç uyanıyorum ve dinleniyorum.","ilknur"],["Vous avez raison. Et voilà votre café !","Haklısınız. İşte kahveniz!","serveur"],["Ilknur est restée une heure au café. Elle a lu un livre.","Ilknur kafede bir saat kaldı. Bir kitap okudu.","n"],["L'addition, s'il vous plaît. Je peux payer par carte ?","Hesap lütfen. Kartla ödeyebilir miyim?","ilknur"],["Bien sûr. Ça fait six dollars cinquante.","Tabii. Altı dolar elli ediyor.","serveur"],["Merci, bonne journée !","Teşekkürler, iyi günler!","ilknur"],["Merci, à samedi prochain !","Teşekkürler, gelecek cumartesi görüşmek üzere!","serveur"]],"gloss":[["sur place","burada (yemek için)"],["à emporter","götürmek için"],["prendre","almak, sipariş etmek"],["pressée","acelesi olan"],["en semaine","hafta içi"],["se dépêcher","acele etmek"],["se reposer","dinlenmek"],["avoir raison","haklı olmak"],["a lu","okudu (lire)"],["l'addition","hesap"],["payer par carte","kartla ödemek"],["bien sûr","tabii"]],"qs":[["Ilknur ne sipariş etti? Burada mı yedi?","Sütlü kahve ve kruvasan; evet, kafede oturdu."],["Hafta içi sabahları ile cumartesi sabahları arasındaki fark ne?","Hafta içi altıda kalkıp acele ediyor; cumartesi geç uyanıp dinleniyor."],["Kafede ne kadar kaldı, ne ödedi ve nasıl?","Bir saat; 6,50 $; kartla."]]},{"u":7,"kind":"Gerçek metin","title":"Bibliothèque : heures d'ouverture","tr_title":"Kütüphane: açılış saatleri","speakers":{},"lines":[["Bibliothèque municipale du Plateau","Plateau Belediye Kütüphanesi","n"],["Heures d'ouverture","Açılış saatleri","n"],["Du lundi au vendredi : de dix heures à vingt heures.","Pazartesiden cumaya: 10:00–20:00.","n"],["Le samedi et le dimanche : de dix heures à dix-sept heures.","Cumartesi ve pazar: 10:00–17:00.","n"],["Horaire d'été, du vingt-quatre juin au premier septembre : la bibliothèque ferme à dix-huit heures.","Yaz saatleri, 24 Haziran – 1 Eylül: kütüphane 18:00'de kapanır.","n"],["La bibliothèque est fermée le vingt-cinq décembre et le premier janvier.","Kütüphane 25 Aralık ve 1 Ocak'ta kapalıdır.","n"],["Vous pouvez emprunter dix livres pendant trois semaines.","Üç haftalığına on kitap ödünç alabilirsiniz.","n"],["Vous devez rendre les livres à la date indiquée.","Kitapları belirtilen tarihte geri vermelisiniz.","n"],["Nouveau : depuis le mois d'octobre, l'heure du conte pour les enfants est le mercredi à seize heures.","Yeni: ekimden beri çocuklar için masal saati çarşambaları 16:00'da.","n"],["Inscription gratuite pour les résidents de Montréal.","Montréal sakinleri için kayıt ücretsizdir.","n"]],"gloss":[["la bibliothèque","kütüphane"],["municipale","belediyeye ait"],["l'ouverture","açılış"],["l'horaire","saatler, çizelge"],["fermer","kapanmak, kapatmak"],["fermée","kapalı"],["emprunter","ödünç almak"],["pendant","boyunca"],["rendre","geri vermek"],["indiquée","belirtilen"],["l'heure du conte","masal saati"],["l'inscription","kayıt, üyelik"],["gratuite","ücretsiz"],["les résidents","sakinler"]],"qs":[["Hafta içi ve hafta sonu kütüphane kaçta kapanıyor?","Hafta içi 20:00, hafta sonu 17:00."],["Yazın ne değişiyor, hangi tarihler arasında?","24 Haziran – 1 Eylül arası 18:00'de kapanıyor."],["Kaç kitap, ne kadar süreyle alınabilir?","On kitap, üç hafta."],["Çocuklar için ne var, ne zaman?","Masal saati, çarşambaları 16:00 (ekimden beri)."]]},{"u":8,"kind":"Klasik","title":"Le Petit Chaperon rouge","tr_title":"Kırmızı Başlıklı Kız (Perrault)","speakers":{"chaperon":{"voice":"jessica","label":"Le Petit Chaperon rouge"},"loup":{"voice":"pierre","label":"Le loup"}},"lines":[["Il était une fois une petite fille.","Bir varmış bir yokmuş, küçük bir kız varmış.","n"],["Elle habitait dans un village, près d'une grande forêt.","Büyük bir ormanın yakınında, bir köyde otururmuş.","n"],["Elle portait toujours un petit chapeau rouge.","Hep küçük kırmızı bir başlık takarmış.","n"],["Alors, tout le monde l'appelait le Petit Chaperon rouge.","Bu yüzden herkes ona Kırmızı Başlıklı Kız dermiş.","n"],["Un jour, sa grand-mère était malade.","Bir gün anneannesi hastaymış.","n"],["Sa mère a préparé un gâteau, et la petite fille est partie dans la forêt.","Annesi bir kek hazırladı ve küçük kız ormana gitti.","n"],["Il faisait beau et les oiseaux chantaient.","Hava güzeldi ve kuşlar ötüyordu.","n"],["Tout à coup, un loup est arrivé.","Birdenbire bir kurt geldi.","n"],["« Bonjour, petite fille ! Où est-ce que tu vas ? »","\"Merhaba küçük kız! Nereye gidiyorsun?\"","loup"],["« Je vais chez ma grand-mère. Elle habite de l'autre côté de la forêt. »","\"Anneanneme gidiyorum. Ormanın öbür tarafında oturuyor.\"","chaperon"],["Le loup a pris le chemin le plus court et il est arrivé avant elle.","Kurt en kısa yolu tuttu ve ondan önce vardı.","n"],["Il a mangé la grand-mère et il s'est couché dans son lit.","Anneanneyi yedi ve onun yatağına yattı.","n"],["Quand la petite fille est entrée, la maison était sombre.","Küçük kız içeri girdiğinde ev karanlıktı.","n"],["« Grand-mère, comme vous avez de grandes dents ! »","\"Anneanne, ne kadar büyük dişleriniz var!\"","chaperon"],["« C'est pour mieux te manger, mon enfant ! »","\"Seni daha iyi yemek için, çocuğum!\"","loup"],["Heureusement, un chasseur passait devant la maison. Il a entendu les cris et il est entré.","Neyse ki bir avcı evin önünden geçiyordu. Çığlıkları duydu ve içeri girdi.","n"],["Il a sauvé la petite fille et sa grand-mère.","Küçük kızı ve anneannesini kurtardı.","n"]],"gloss":[["il était une fois","bir varmış bir yokmuş"],["la forêt","orman"],["porter","giymek, takmak"],["le chapeau","şapka, başlık"],["appeler","çağırmak, demek"],["la grand-mère","anneanne, babaanne"],["malade","hasta"],["les oiseaux","kuşlar"],["chanter","şarkı söylemek, ötmek"],["le loup","kurt"],["le chemin","yol"],["le plus court","en kısa"],["le lit","yatak"],["sombre","karanlık"],["les dents","dişler"],["mieux","daha iyi"],["heureusement","neyse ki"],["le chasseur","avcı"],["les cris","çığlıklar"],["sauver","kurtarmak"]],"qs":[["Hikâyenin başındaki hangi fiiller imparfait, neden?","était, habitait, portait, appelait: sahneyi ve alışkanlığı anlatıyor (tasvir)."],["Ormanda hava nasıldı?","Hava güzeldi ve kuşlar ötüyordu: il faisait beau, les oiseaux chantaient."],["\"Tout à coup\"tan sonra hangi zaman geliyor?","passé composé: un loup est arrivé. Bir olay oluyor."]]},{"u":8,"kind":"Günlük hayat","title":"Au poste de police","tr_title":"Karakolda","speakers":{"policier":{"voice":"tom","label":"Le policier"},"ilknur":{"voice":"jessica","label":"Ilknur"}},"lines":[["Bonjour madame. Je peux vous aider ?","Merhaba hanımefendi. Yardımcı olabilir miyim?","policier"],["Bonjour. J'ai perdu mon sac ce matin.","Merhaba. Bu sabah çantamı kaybettim.","ilknur"],["Où est-ce que vous étiez ?","Neredeydiniz?","policier"],["J'étais dans le métro, sur la ligne orange. Il y avait beaucoup de monde.","Metrodaydım, turuncu hatta. Çok kalabalık vardı.","ilknur"],["Il était quelle heure ?","Saat kaçtı?","policier"],["Il était huit heures et quart. C'était l'heure de pointe.","Sekizi çeyrek geçiyordu. Yoğun saatti.","ilknur"],["Qu'est-ce que vous faisiez ?","Ne yapıyordunuz?","policier"],["Je lisais un livre. À la station Berri-UQAM, je suis descendue pour changer de ligne.","Kitap okuyordum. Berri-UQAM istasyonunda hat değiştirmek için indim.","ilknur"],["Et là, vous n'aviez plus votre sac ?","Ve orada çantanız artık yok muydu?","policier"],["Non. Tout à coup, j'ai vu que mon sac n'était plus sur mon épaule.","Hayır. Birdenbire çantamın artık omzumda olmadığını gördüm.","ilknur"],["Comment est votre sac ?","Çantanız nasıl?","policier"],["Il est noir, assez petit. Il y avait mon portefeuille et ma carte OPUS dedans.","Siyah, oldukça küçük. İçinde cüzdanım ve OPUS kartım vardı.","ilknur"],["D'accord. Vous pouvez remplir ce formulaire ? Nous allons téléphoner à la STM.","Tamam. Bu formu doldurabilir misiniz? STM'yi arayacağız.","policier"],["Merci beaucoup, monsieur.","Çok teşekkürler, beyefendi.","ilknur"]],"gloss":[["le poste de police","karakol"],["perdre","kaybetmek"],["le sac","çanta"],["l'heure de pointe","yoğun saat"],["changer de ligne","hat değiştirmek"],["ne … plus","artık … değil"],["l'épaule","omuz"],["noir","siyah"],["assez","oldukça"],["le portefeuille","cüzdan"],["dedans","içinde"],["remplir","doldurmak"],["le formulaire","form"]],"qs":[["İlknur çantasını nerede kaybetti?","Metroda, turuncu hatta; Berri-UQAM'da indiğinde fark etti."],["Polis hangi soruları imparfait ile sordu? Neden?","Où est-ce que vous étiez ? / Il était quelle heure ? / Qu'est-ce que vous faisiez ?: o anki durumu (arka planı) soruyor."],["Çantada ne vardı?","Cüzdanı ve OPUS kartı."]]},{"u":8,"kind":"Gerçek metin","title":"Annonce dans le métro","tr_title":"Metro anonsu","speakers":{},"lines":[["Votre attention, s'il vous plaît.","Dikkatinize, lütfen.","n"],["En raison d'un incident, le service est interrompu sur la ligne orange,","Bir arıza nedeniyle turuncu hatta hizmet durduruldu,","n"],["entre les stations Berri-UQAM et Jean-Talon.","Berri-UQAM ve Jean-Talon istasyonları arasında.","n"],["Nous vous invitons à prendre la ligne verte jusqu'à la station Pie-IX,","Yeşil hatla Pie-IX istasyonuna kadar gitmenizi rica ediyoruz,","n"],["ou à utiliser les navettes d'autobus à la sortie de la station.","ya da istasyon çıkışındaki servis otobüslerini kullanmanızı.","n"],["Le service devrait reprendre vers neuf heures trente.","Hizmetin dokuz buçuk civarında yeniden başlaması bekleniyor.","n"],["Merci de votre patience.","Sabrınız için teşekkürler.","n"]],"gloss":[["votre attention","dikkatiniz"],["en raison de","… nedeniyle"],["un incident","olay, arıza"],["interrompu","kesildi, durduruldu"],["jusqu'à","…e kadar"],["utiliser","kullanmak"],["une navette","servis (aracı)"],["la sortie","çıkış"],["reprendre","yeniden başlamak"],["vers","civarında, doğru"],["la patience","sabır"]],"qs":[["Hangi hatta sorun var, hangi istasyonlar arasında?","Turuncu hat, Berri-UQAM ile Jean-Talon arasında."],["Yolculara ne öneriliyor?","Yeşil hatla Pie-IX'e kadar gitmek ya da istasyon çıkışındaki servis otobüslerini kullanmak."],["Hizmet ne zaman yeniden başlayacak?","Dokuz buçuk civarında (vers neuf heures trente)."]]}], SIDX=[{"1.0|Bonjour ! Je m'appelle Marc.":[0,20759],"1.0|Je suis canadien.":[20759,13706],"1.0|Je suis ingénieur.":[34465,14803],"1.0|Voici Ana. Elle est brésilienne.":[49268,21229],"1.0|Elle est infirmière.":[70497,15430],"1.0|Elle est très gentille.":[85927,14176],"1.0|Nous sommes amis.":[100103,12452],"1.0|Et vous ? Vous êtes turc ?":[112555,16370],"1.0|Oui, je suis turc. Je m'appelle Kerem.":[128925,22326],"1.0|Enchanté !":[151251,11198],"1.4|Bonjour ! Je m'appelle Marc.":[162449,25775],"1.4|Je suis canadien.":[188224,18565],"1.4|Je suis ingénieur.":[206789,18565],"1.4|Voici Ana. Elle est brésilienne.":[225354,26715],"1.4|Elle est infirmière.":[252069,19505],"1.4|Elle est très gentille.":[271574,16997],"1.4|Nous sommes amis.":[288571,15430],"1.4|Et vous ? Vous êtes turc ?":[304001,19505],"1.4|Oui, je suis turc. Je m'appelle Kerem.":[323506,27499],"1.4|Enchanté !":[351005,14490],"1.0|voici":[365495,9944],"1.0|gentille":[375439,10415],"1.0|brésilienne":[385    <div class="ak-note">${EX.tur==='alistirma'?'<b>Alıştırma:</b> puansız ve süresiz. Her cevap anında düzeltilir; yanlışsa doğrusu ve nedeni çıkar. Teslim etmen gerekmez.':sinav?'<b>Gerçek sınav kuralları:</b> her bölümün süresi kendiliğinden işler; süre bitince bölüm kapanır. Dinleme kayıtları <b>bir kez</b> çalınır ve soru kayıttan sonra gelir. Bitmiş bir bölüme geri dönülmez. Sözlük, kart ya da not kullanma.':'<b>Ödev:</b> süre yok; dinleme kayıtlarını en fazla belirtilen sayıda dinleyebilirsin. Bölümler arasında gidip gelebilirsin.'}</div>
   ${needMic?`<div class="ak-note">Bu sınavda konuşma bölümü var: mikrofon izni gerekecek. <button class="link" id="akmic">Mikrofonu şimdi dene</button><span id="akmicr" class="small"></span></div>`:''}
   <div class="spacer"></div><div class="bottom">${st&&st.gonderildi?`<div class="ak-note ok">Bu ${TURAD[EX.tur].toLowerCase()} ${new Date(st.gonderildi).toLocaleString('tr-TR')} tarihinde teslim edildi.</div><button class="btn" id="akagain">Baştan yap (yeni deneme)</button>`:
     st&&st.basla?`<button class="big-btn" id="akgo">${st.bitti?'Teslim ekranına git':'Kaldığın yerden devam et'}</button><button class="btn" id="akagain">Sıfırla ve baştan başla</button>`:`<button class="big-btn" id="akgo">Başla</button>`}</div>`;
  $('akbk').onclick=()=>{AS={view:'list'};render()};

  if($('akgo'))$('akgo').onclick=()=>{ctx();let s=xState(EX.id);if(!s){s={id:EX.id,basla:Date.now(),bi:0,qi:{},ans:{},dinle:{},faz:{},son:{},kayit:{},bitti:false};xSave(s)}
    AS={view:s.bitti?'son':'kos',id:EX.id};render()};
