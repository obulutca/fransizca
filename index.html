<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Fransızca Kartlar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* Layout: one narrow app column. Each screen does one job; the primary action sits at the bottom in thumb reach; a two-tab bar (Tekrar / Oku-Dinle) keeps the two parts apart and hides during a session. French text is set in the serif, the interface in the sans. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#18202F; --muted:#626B7E; --line:#DDE1E9; --soft:#ECEFF5;
  --accent:#2A44D4; --accent-ink:#FFFFFF; --hl:#E3E8FF; --good:#1E8A52; --good-bg:#E3F4EA; --bad:#C2412D; --bad-bg:#FBE9E5; --warn:#9A6200; --warn-bg:#FBF0DA;
  --fr:"Instrument Serif",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#9AA2B4; --line:#2B3140; --soft:#232837;
  --accent:#8FA3FF; --accent-ink:#11141B; --hl:#262F52; --good:#5FCB8E; --good-bg:#183326; --bad:#F08A76; --bad-bg:#3A1F1A; --warn:#F0C060; --warn-bg:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#9AA2B4; --line:#2B3140; --soft:#232837;
  --accent:#8FA3FF; --accent-ink:#11141B; --hl:#262F52; --good:#5FCB8E; --good-bg:#183326; --bad:#F08A76; --bad-bg:#3A1F1A; --warn:#F0C060; --warn-bg:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 20px;display:flex;flex-direction:column;gap:16px}
.nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8125rem;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.top h1{font-size:1.25rem;margin:0;font-weight:700}
.icon{border:0;background:none;width:40px;height:40px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon svg{width:22px;height:22px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.big-btn{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;font-size:1.0625rem;font-weight:700}
.big-btn:disabled{opacity:.45;cursor:default}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;text-align:left}
.grow{flex:1;min-width:0} .spacer{flex:1}
.bottom{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
/* home */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.count{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px}
.resume{background:var(--hl);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.week i{width:24px;height:24px;border-radius:99px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.6875rem;color:var(--muted)}
.week i.on{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-width:0}
.stats b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.sync{font-size:.75rem;color:var(--muted);text-align:center}
/* session */
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.kind{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.flip{perspective:1400px;cursor:pointer}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;min-height:280px}
.face.front{justify-content:center;align-items:center;text-align:center}
.face.back{transform:rotateY(180deg)}
.hint{font-size:.8125rem;color:var(--muted)}
.fr-big{font-family:var(--fr);font-size:2.4rem;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.fr-mid{font-family:var(--fr);font-size:1.75rem;line-height:1.15;overflow-wrap:anywhere}
.tr-big{font-size:1.375rem;font-weight:600;line-height:1.3}
.en{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9375rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;align-items:flex-start}
.ex .t{font-family:var(--fr);font-size:1.25rem;line-height:1.3}
.ex .s{color:var(--muted);font-size:.875rem}
.note{font-size:.875rem;background:var(--soft);border-radius:10px;padding:8px 10px}
.lines p{margin:0 0 6px}
.say{border:1px solid var(--line);background:var(--soft);color:var(--accent);width:44px;height:44px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say.sm{width:34px;height:34px}
.say svg{width:20px;height:20px} .say.sm svg{width:16px;height:16px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
.grades button small{font-weight:500;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.grades .g1{color:var(--bad)} .grades .g3{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-size:1.0625rem;display:flex;gap:12px;align-items:center}
.opt .n{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:.8125rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.frt{font-family:var(--fr);font-size:1.3rem}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.answer{width:100%;font:inherit;font-size:1.25rem;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.answer:focus{border-color:var(--accent);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;font-size:1.0625rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.built{border-bottom:2px solid var(--line);padding-bottom:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--fr);font-size:1.25rem;line-height:1.1;box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}
.cloze{font-family:var(--fr);font-size:1.5rem;line-height:1.35}
.cloze .gap{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent)}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.near{background:var(--warn-bg);color:var(--warn)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{font-size:1rem} .fb .fr-a{font-family:var(--fr);font-size:1.5rem;color:var(--ink);line-height:1.2}
.fb .you{font-size:.9375rem;color:var(--ink)}
.fb .you .x{background:var(--bad-bg);color:var(--bad);border-radius:3px;text-decoration:line-through}
.dict{display:flex;justify-content:center;gap:12px;padding:8px 0}
.dict .say{width:72px;height:72px} .dict .say svg{width:30px;height:30px}
.dict .say.slow{font-weight:700;font-size:.875rem}
/* settings & lists */
.set{display:flex;flex-direction:column;gap:8px}
.set label{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-family:var(--fr);font-size:1.25rem;line-height:1.2}
.item .s{font-size:.875rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.okc{color:var(--good)} .noc{color:var(--bad)}
.chip{font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);display:inline-block;margin-bottom:4px}
.chip.k1{background:var(--hl);color:var(--accent)} .chip.k3{background:var(--good-bg);color:var(--good)} .chip.k2{background:var(--warn-bg);color:var(--warn)}
.done-mark{color:var(--good);font-weight:700}
/* 14-day chart */
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.chart button{border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.chart .b{width:min(100%,14px);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.zero{background:var(--soft)}
.chart button[aria-pressed="true"] .b{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.6875rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tip{font-size:.875rem;min-height:1.5em}
/* reader */
.steps{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.steps button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.875rem;color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 8px}
.listen .t{font-family:var(--fr);font-size:2rem;line-height:1.1}
.lines2{display:flex;flex-direction:column;gap:2px}
.line{padding:8px 10px;border-radius:10px;cursor:pointer}
.line .who{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.line .who.v-jessica,.line .who.v-siwis{color:var(--warn)}
.line .f{font-family:var(--fr);font-size:1.375rem;line-height:1.35}
.line .tr{font-size:.9375rem;color:var(--muted)}
.line.on{background:var(--hl)}
.gw{border-bottom:2px dotted var(--accent);cursor:help}
.player{border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-around;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.player button{border:0;background:none;width:48px;height:48px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.player button svg{width:24px;height:24px}
.player .main{background:var(--accent);color:var(--accent-ink);width:56px;height:56px}
.player .spd{font-weight:700;font-size:.875rem;width:auto;padding:0 10px;border:1px solid var(--line);height:36px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet>div{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet .w{font-family:var(--fr);font-size:1.75rem}
.qs{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.qs li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qs .a{color:var(--good);font-weight:600}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;max-width:min(480px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.875rem;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.err{background:var(--bad);color:#fff}
.diag{font-size:.8125rem;background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </nav>
</div>

:[["Paul et Julie sont médecins.","Paul ve Julie doktor.","n"],["Ils sont très fatigués.","Çok yorgunlar.","n"],["Julie est française.","Julie Fransız.","n"],["Paul est québécois.","Paul Québecli.","n"],["Il est grand et sympathique.","Uzun boylu ve sevimli.","n"],["Julie n'est pas grande. Elle est petite.","Julie uzun değil. Kısa boylu.","n"],["Ils ne sont pas mariés.","Evli değiller.","n"],["Ils sont amis.","Arkadaşlar.","n"],["Et toi ? Tu es fatigué ?","Ya sen? Yorgun musun?","n"],["Non, je ne suis pas fatigué. Je suis content !","Hayır, yorgun değilim. Mutluyum!","ami"]],"gloss":[["sympathique","sevimli, cana yakın"],["marié(e)s","evli"],["content","memnun, mutlu"]],"qs":[["Paul ve Julie'nin mesleği ne?","Doktor."],["Julie nasıl biri (boy)?","Kısa boylu."],["Paul ve Julie evli mi?","Hayır, arkadaşlar."]],"kind":"Günlük hayat","speakers":{"ami":{"voice":"pierre","label":"Un ami"}}},{"u":2,"title":"La famille de Leila","tr_title":"Leila'nın ailesi","lines":[["Leila a trente-quatre ans.","Leila otuz dört yaşında.","n"],["Elle a un mari, Karim, et deux enfants.","Bir kocası, Karim, ve iki çocuğu var.","n"],["Les enfants s'appellent Adam et Sara.","Çocukların adı Adam ve Sara.","n"],["Adam a huit ans et Sara a cinq ans.","Adam sekiz, Sara beş yaşında.","n"],["La famille a une petite maison.","Ailenin küçük bir evi var.","n"],["Dans la maison, il y a trois chambres et une cuisine.","Evde üç yatak odası ve bir mutfak var.","n"],["Il y a aussi un jardin.","Bir de bahçe var.","n"],["Leila n'a pas de voiture, mais Karim a une voiture.","Leila'nın arabası yok ama Karim'in arabası var.","n"],["Ils ont un chat. Le chat a deux ans.","Bir kedileri var. Kedi iki yaşında.","n"]],"gloss":[["dans","içinde"],["la chambre","yatak odası"],["le jardin","bahçe"],["aussi","de, da, ayrıca"],["mais","ama"]],"qs":[["Leila kaç yaşında?","34."],["Evde kaç yatak odası var?","Üç."],["Kimin arabası var?","Karim'in."]],"kind":"Günlük hayat","speakers":{}},{"u":2,"title":"À l'usine","tr_title":"Fabrikada","lines":[["Il y a une usine à Laval.","Laval'de bir fabrika var.","n"],["Dans l'usine, il y a quarante machines et soixante employés.","Fabrikada kırk makine ve altmış çalışan var.","n"],["Il y a un bureau et une cafétéria.","Bir ofis ve bir kafeterya var.","n"],["Le chef s'appelle Monsieur Roy.","Şefin adı Bay Roy.","n"],["Il a cinquante-deux ans.","Elli iki yaşında.","n"],["Il a un ordinateur et un téléphone.","Bir bilgisayarı ve bir telefonu var.","n"],["Aujourd'hui, il y a un problème.","Bugün bir sorun var.","n"],["Il n'y a pas de café dans la cafétéria !","Kafeteryada kahve yok!","n"],["Les employés ne sont pas contents.","Çalışanlar memnun değil.","n"]],"gloss":[["l'employé(e)","çalışan"],["le chef","şef, amir"],["l'ordinateur","bilgisayar"],["aujourd'hui","bugün"]],"qs":[["Fabrikada kaç makine var?","Kırk."],["Bay Roy kaç yaşında?","52."],["Bugünkü sorun ne?","Kafeteryada kahve yok."]],"kind":"Günlük hayat","speakers":{}},{"u":3,"title":"Une journée de travail","tr_title":"Bir iş günü","lines":[["Je m'appelle Sophie. Je travaille dans une usine.","Benim adım Sophie. Bir fabrikada çalışıyorum.","n"],["Je commence à sept heures et je termine à quinze heures trente.","Yedide başlıyorum ve on beş otuzda bitiriyorum.","n"],["Le matin, je vérifie les machines.","Sabah makineleri kontrol ediyorum.","n"],["À midi, nous mangeons ensemble à la cafétéria.","Öğlen kafeteryada birlikte yemek yiyoruz.","n"],["L'après-midi, je répare les machines avec mon équipe.","Öğleden sonra ekibimle makineleri tamir ediyorum.","n"],["Mon collègue Marc programme les robots.","İş arkadaşım Marc robotları programlıyor.","n"],["Le soir, je cuisine et mon mari regarde la télé.","Akşam yemek yapıyorum, kocam televizyon izliyor.","n"],["Le samedi, nous jouons au soccer avec nos enfants.","Cumartesileri çocuklarımızla futbol oynuyoruz.","n"],["Le dimanche, nous restons à la maison.","Pazarları evde kalıyoruz.","n"]],"gloss":[["le collègue","iş arkadaşı"],["l'équipe","ekip"]],"qs":[["Sophie saat kaçta başlıyor, kaçta bitiriyor?","7'de başlıyor, 15:30'da bitiriyor."],["Marc ne yapıyor?","Robotları programlıyor."],["Cumartesileri ne yapıyorlar?","Çocuklarıyla futbol oynuyorlar."]],"kind":"Günlük hayat","speakers":{}},{"u":3,"title":"Où est la clé ?","tr_title":"Anahtar nerede?","lines":[["Il est huit heures moins le quart.","Saat sekize çeyrek var.","n"],["Thomas cherche sa clé.","Thomas anahtarını arıyor.","n"],["Chérie, tu as ma clé ?","Hayatım, anahtarım sende mi?","thomas"],["Non, je n'ai pas ta clé. Elle n'est pas dans la cuisine ?","Hayır, anahtarın bende değil. Mutfakta değil mi?","femme"],["Non. Je cherche, je cherche... Je ne trouve pas la clé !","Hayır. Arıyorum, arıyorum... Anahtarı bulamıyorum!","thomas"],["Regarde dans ta poche !","Cebine bak!","femme"],["Ah ! Voilà ! La clé est dans ma poche.","Aa! İşte! Anahtar cebimde.","thomas"],["Bon, il est huit heures. Tu arrives en retard !","Peki, saat sekiz. Geç kalıyorsun!","femme"]],"gloss":[["chérie","hayatım, canım"],["regarde !","bak!"],["la poche","cep"],["en retard","geç"]],"qs":[["Hikaye başında saat kaç?","7:45."],["Thomas ne arıyor?","Anahtarını."],["Anahtar nerede?","Thomas'ın cebinde."]],"kind":"Günlük hayat","speakers":{"thomas":{"voice":"tom","label":"Thomas"},"femme":{"voice":"jessica","label":"Sa femme"}}},{"u":4,"title":"Le week-end de Nadia","tr_title":"Nadia'nın hafta sonu","lines":[["Nadia vient du Liban.","Nadia Lübnan'dan geliyor.","n"],["Maintenant, elle habite à Ottawa.","Şimdi Ottawa'da yaşıyor.","n"],["Ce week-end, il va faire beau.","Bu hafta sonu hava güzel olacak.","n"],["Samedi matin, elle va au marché à vélo.","Cumartesi sabah pazara bisikletle gidiyor.","n"],["L'après-midi, elle va au parc avec ses enfants.","Öğleden sonra çocuklarıyla parka gidiyor.","n"],["Le soir, son amie Julie vient à la maison.","Akşam arkadaşı Julie eve geliyor.","n"],["Elles vont faire la cuisine ensemble.","Birlikte yemek yapacaklar.","n"],["Dimanche, il va pleuvoir.","Pazar yağmur yağacak.","n"],["Nadia ne va pas sortir.","Nadia dışarı çıkmayacak.","n"],["Elle va faire le ménage et regarder un film.","Ev temizliği yapacak ve film izleyecek.","n"]],"gloss":[["le Liban","Lübnan"],["sortir","dışarı çıkmak"]],"qs":[["Nadia nereli, nerede yaşıyor?","Lübnan'dan, Ottawa'da yaşıyor."],["Cumartesi sabah pazara nasıl gidiyor?","Bisikletle."],["Pazar neden dışarı çıkmıyor?","Yağmur yağacak."]],"kind":"Günlük hayat","speakers":{}},{"u":4,"title":"Un voyage à Québec","tr_title":"Québec'e bir yolculuk","lines":[["Qu'est-ce que tu fais la semaine prochaine ?","Gelecek hafta ne yapıyorsun?","claire"],["Je vais à Québec avec mon mari.","Kocamla Québec'e gidiyorum.","emma"],["Ah oui ? Comment est-ce que vous allez à Québec ?","Öyle mi? Québec'e nasıl gidiyorsunuz?","claire"],["En train. Ça prend trois heures.","Trenle. Üç saat sürüyor.","emma"],["Il va faire froid là-bas !","Orada hava soğuk olacak!","claire"],["Oui, il va neiger. Mais nous adorons la neige.","Evet, kar yağacak. Ama karı çok severiz.","emma"],["Vous allez visiter la vieille ville ?","Eski şehri gezecek misiniz?","claire"],["Oui, et nous allons manger au restaurant.","Evet, bir de restoranda yemek yiyeceğiz.","emma"],["Bon voyage !","İyi yolculuklar!","claire"]],"gloss":[["le voyage","yolculuk"],["là-bas","orada"],["visiter","gezmek"],["la vieille ville","eski şehir"]],"qs":[["Québec'e kiminle gidiyor?","Kocasıyla."],["Nasıl gidiyorlar, ne kadar sürüyor?","Trenle, üç saat."],["Orada hava nasıl olacak?","Soğuk, kar yağacak."]],"kind":"Günlük hayat","speakers":{"claire":{"voice":"jessica","label":"Claire"},"emma":{"voice":"siwis","label":"Emma"}}},{"u":5,"title":"À la boulangerie","tr_title":"Fırında","lines":[["Il est huit heures. Marc entre dans la boulangerie.","Saat sekiz. Marc fırına giriyor.","n"],["Bonjour, monsieur !","Günaydın, beyefendi!","bou"],["Bonjour ! Je voudrais une baguette et deux croissants, s'il vous plaît.","Günaydın! Bir baget ve iki kruvasan istiyorum, lütfen.","marc"],["Voilà. Avec ça ?","Buyurun. Başka?","bou"],["Est-ce que vous avez du gâteau au chocolat ?","Çikolatalı pastanız var mı?","marc"],["Oui. Vous voulez un morceau ?","Evet. Bir dilim ister misiniz?","bou"],["Oui, merci. C'est tout. Ça fait combien ?","Evet, teşekkürler. Bu kadar. Ne kadar tuttu?","marc"],["Ça fait neuf dollars cinquante.","Dokuz dolar elli.","bou"],["Je peux payer par carte ?","Kartla ödeyebilir miyim?","marc"],["Bien sûr. Merci et bonne journée !","Tabii ki. Teşekkürler, iyi günler!","bou"]],"gloss":[["entrer dans","-e girmek"],["au chocolat","çikolatalı"],["un morceau","bir parça, dilim"]],"qs":[["Marc ne istiyor? (ilk istek)","Bir baget ve iki kruvasan."],["Başka ne alıyor?","Bir dilim çikolatalı pasta."],["Toplam ne kadar, nasıl ödüyor?","9,50 $, kartla."]],"kind":"Günlük hayat","speakers":{"bou":{"voice":"jessica","label":"La boulangère"},"marc":{"voice":"tom","label":"Marc"}}},{"u":5,"title":"Un dîner entre amis","tr_title":"Arkadaşlarla akşam yemeği","lines":[["Samedi soir, nos amis viennent à la maison pour le dîner.","Cumartesi akşamı arkadaşlarımız akşam yemeğine bize geliyor.","n"],["Je dois faire les courses.","Alışveriş yapmalıyım.","n"],["Mon mari, Osman, ne peut pas venir avec moi : il doit travailler.","Kocam Osman benimle gelemiyor: çalışması gerekiyor.","n"],["Je vais au supermarché.","Süpermarkete gidiyorum.","n"],["J'achète du poisson, du riz, des tomates et des légumes.","Balık, pirinç, domates ve sebze alıyorum.","n"],["J'achète aussi un kilo de pommes et deux bouteilles de jus d'orange.","Bir kilo elma ve iki şişe portakal suyu da alıyorum.","n"],["Je n'achète pas de viande, parce que notre amie Sara ne mange pas de viande.","Et almıyorum, çünkü arkadaşımız Sara et yemiyor.","n"],["À la caisse, ça fait quatre-vingt-trois dollars quarante.","Kasada 83,40 dolar tutuyor.","n"],["C'est cher ! Je paie par carte.","Pahalı! Kartla ödüyorum.","n"],["Le soir, je vais faire la cuisine et Osman va faire un gâteau.","Akşam ben yemek yapacağım, Osman da pasta yapacak.","n"]],"gloss":[["le dîner","akşam yemeği"],["pour","için"],["je paie","ödüyorum (payer)"]],"qs":[["Kimler, ne için geliyor?","Arkadaşlar, akşam yemeği için."],["Neden et almıyor?","Sara et yemiyor."],["Akşam Osman ne yapacak?","Pasta yapacak."]],"kind":"Günlük hayat","speakers":{}},{"u":5,"kind":"Klasik","title":"Le Corbeau et le Renard","tr_title":"Karga ile Tilki (La Fontaine)","lines":[["Un corbeau est sur un arbre.","Bir karga bir ağacın üstünde.","n"],["Il a un grand morceau de fromage.","Büyük bir parça peyniri var.","n"],["Un renard passe. Il a faim.","Bir tilki geçiyor. Karnı aç.","n"],["Le renard veut le fromage, mais il ne peut pas monter dans l'arbre.","Tilki peyniri istiyor ama ağaca çıkamıyor.","n"],["Alors, il dit :","Bunun üzerine diyor ki:","n"],["« Bonjour, Monsieur du Corbeau ! Vous êtes très beau ! »","\"Günaydın Karga Bey! Çok yakışıklısınız!\"","renard"],["« Vous chantez bien aussi ? Je veux écouter votre voix ! »","\"Güzel şarkı da söylüyor musunuz? Sesinizi dinlemek istiyorum!\"","renard"],["Le corbeau est très content. Il ouvre son bec pour chanter.","Karga çok memnun. Şarkı söylemek için gagasını açıyor.","n"],["Le fromage tombe. Le renard prend le fromage.","Peynir düşüyor. Tilki peyniri alıyor.","n"],["« Merci, monsieur ! Il ne faut pas écouter les flatteurs ! »","\"Teşekkürler, bayım! Dalkavukları dinlememek lazım!\"","renard"]],"gloss":[["arbre","ağaç"],["renard","tilki"],["corbeau","karga"],["passe","geçiyor (passer)"],["monter","çıkmak"],["dit","der, söyler (dire)"],["beau","yakışıklı, güzel"],["chantez","şarkı söylüyorsunuz (chanter)"],["voix","ses"],["ouvre","açıyor (ouvrir)"],["bec","gaga"],["tombe","düşüyor (tomber)"],["prend","alıyor (prendre)"],["flatteurs","dalkavuklar"]],"qs":[["Karganın neyi var?","Büyük bir parça peynir."],["Tilki neden peyniri kendisi alamıyor?","Ağaca çıkamıyor."],["Karga neden gagasını açıyor?","Tilki onu övdü; şarkı söylemek istiyor."]],"speakers":{"renard":{"voice":"tom","label":"Le renard"}}},{"u":5,"kind":"Gerçek metin","title":"Message de la pharmacie","tr_title":"Eczaneden sesli mesaj","lines":[["Bonjour, ici la pharmacie du Centre.","Merhaba, burası Merkez Eczanesi.","ph"],["C'est un message pour madame Bulut.","Bu mesaj Bulut Hanım için.","ph"],["Votre commande est prête.","Siparişiniz hazır.","ph"],["Vous pouvez venir demain, entre neuf heures et dix-huit heures.","Yarın saat dokuz ile on sekiz arasında gelebilirsiniz.","ph"],["Ça coûte vingt-quatre dollars cinquante.","Tutarı 24,50 dolar.","ph"],["Vous devez apporter votre carte d'assurance maladie.","Sağlık sigortası kartınızı getirmelisiniz.","ph"],["Merci et bonne journée !","Teşekkürler, iyi günler!","ph"]],"gloss":[["ici","burası"],["commande","sipariş"],["prête","hazır (dişil)"],["entre","arasında"],["apporter","getirmek"],["carte d'assurance maladie","sağlık sigortası kartı"]],"qs":[["Mesaj kimden ve kime?","Merkez Eczanesi'nden Bulut Hanım'a."],["Ne zaman gidebilir?","Yarın, 9:00 ile 18:00 arasında."],["Ne kadar ödeyecek ve ne götürmeli?","24,50 $; sağlık sigortası kartını götürmeli."]],"speakers":{"ph":{"voice":"jessica","label":""}}},{"u":6,"kind":"Klasik","title":"Mange, mon manteau !","tr_title":"Ye kürküm ye (Nasreddin Hoca)","speakers":{"hoca":{"voice":"tom","label":"Nasreddin Hoca"},"hote":{"voice":"pierre","label":"Ev sahibi"}},"lines":[["Un jour, un voisin riche a invité Nasreddin Hodja à un dîner.","Bir gün zengin bir komşu Nasreddin Hoca'yı akşam yemeğine davet etti.","n"],["Ce jour-là, Nasreddin a travaillé dans son jardin.","O gün Nasreddin bahçesinde çalıştı.","n"],["Il n'a pas changé ses vieux vêtements.","Eski elbiselerini değiştirmedi.","n"],["Au dîner, personne n'a parlé avec lui.","Yemekte kimse onunla konuşmadı.","n"],["Il n'a pas eu de soupe, il n'a pas eu de pain.","Ne çorba geldi ne ekmek.","n"],["Alors, il a quitté la fête.","Bunun üzerine davetten ayrıldı.","n"],["Chez lui, il a mis son beau manteau de fourrure.","Evinde güzel kürkünü giydi.","n"],["Une heure après, il a frappé à la porte.","Bir saat sonra kapıyı çaldı.","n"],["« Bienvenue, Nasreddin Hodja ! Voici la meilleure place ! »","\"Hoş geldiniz Nasreddin Hoca! İşte en iyi yer!\"","hote"],["Cette fois, tout le monde a parlé avec lui.","Bu sefer herkes onunla konuştu.","n"],["On a apporté une grande assiette de soupe.","Büyük bir tabak çorba getirdiler.","n"],["Alors, Nasreddin a mis sa manche dans la soupe.","Bunun üzerine Nasreddin yenini çorbaya batırdı.","n"],["« Mange, mon manteau, mange ! »","\"Ye kürküm ye!\"","hoca"],["« Mais Hodja, qu'est-ce que vous faites ? »","\"Ama Hocam, ne yapıyorsunuz?\"","hote"],["« Vous avez invité mon manteau, pas moi ! »","\"Siz kürkümü davet ettiniz, beni değil!\"","hoca"]],"gloss":[["un voisin","komşu"],["riche","zengin"],["les vêtements","elbiseler"],["personne","kimse"],["quitter","ayrılmak"],["la fête","davet, parti"],["le manteau de fourrure","kürk"],["frapper à la porte","kapıyı çalmak"],["la meilleure place","en iyi yer"],["une assiette","tabak"],["la manche","yen, kol"],["cette fois","bu sefer"]],"qs":[["İlk gelişinde neden kimse onunla ilgilenmedi?","Eski iş elbiseleriyle gelmişti."],["Davetten ayrılınca ne yaptı?","Evinde güzel kürkünü giydi ve bir saat sonra geri geldi."],["Neden \"Ye kürküm ye\" dedi?","Çünkü insanlar ona değil, kürküne değer verdi."]]},{"u":6,"kind":"Günlük hayat","title":"Chez le médecin","tr_title":"Doktorda","speakers":{"doc":{"voice":"jessica","label":"La médecin"},"kerem":{"voice":"tom","label":"Kerem"}},"lines":[["Kerem a un rendez-vous chez le médecin à dix heures.","Kerem'in saat onda doktordan randevusu var.","n"],["Bonjour, monsieur. Qu'est-ce qui ne va pas ?","Merhaba beyefendi. Neyiniz var?","doc"],["J'ai mal à la tête et à la gorge.","Başım ve boğazım ağrıyor.","kerem"],["Depuis quand ?","Ne zamandan beri?","doc"],["Depuis hier. Hier soir, j'ai eu de la fièvre.","Dünden beri. Dün akşam ateşim çıktı.","kerem"],["Vous avez pris un médicament ?","İlaç aldınız mı?","doc"],["Oui, j'ai pris du paracétamol, mais je n'ai pas bien dormi.","Evet, parasetamol aldım ama iyi uyuyamadım.","kerem"],["Est-ce que vous avez mangé ce matin ?","Bu sabah bir şey yediniz mi?","doc"],["Non, je n'ai rien mangé. J'ai seulement bu du thé.","Hayır, hiçbir şey yemedim. Sadece çay içtim.","kerem"],["Bon, ouvrez la bouche… Vous avez un gros rhume.","Peki, ağzınızı açın… Ağır bir soğuk algınlığınız var.","doc"],["Vous devez boire beaucoup d'eau et rester à la maison deux jours.","Bol su içmeli ve iki gün evde kalmalısınız.","doc"],["Est-ce que je peux travailler demain ?","Yarın çalışabilir miyim?","kerem"],["Non, vous ne pouvez pas travailler demain. Voici votre ordonnance.","Hayır, yarın çalışamazsınız. İşte reçeteniz.","doc"],["Merci, docteur. Au revoir !","Teşekkürler doktor. Hoşça kalın!","kerem"]],"gloss":[["depuis quand","ne zamandan beri"],["la fièvre","ateş"],["rien","hiçbir şey"],["seulement","sadece"],["ouvrez la bouche","ağzınızı açın"],["un gros rhume","ağır soğuk algınlığı"],["rester","kalmak"],["l'ordonnance","reçete"]],"qs":[["Kerem'in nesi ağrıyor?","Başı ve boğazı."],["Dün akşam ne oldu, ne yaptı?","Ateşi çıktı; parasetamol aldı ama iyi uyuyamadı."],["Doktor ne söylüyor?","Bol su içmeli, iki gün evde kalmalı; yarın çalışamaz."]]},{"u":6,"kind":"Gerçek metin","title":"Courriel de l'école","tr_title":"Okuldan e-posta","speakers":{},"lines":[["Objet : Sortie au musée des sciences","Konu: Bilim müzesi gezisi","n"],["Chers parents,","Sevgili veliler,","n"],["Hier, nous avons visité le musée des sciences avec la classe de deuxième année.","Dün ikinci sınıfla bilim müzesini gezdik.","n"],["Les enfants ont vu des dinosaures et ils ont posé beaucoup de questions.","Çocuklar dinozorlar gördü ve çok soru sordular.","n"],["À midi, nous avons mangé au parc.","Öğlen parkta yemek yedik.","n"],["Trois enfants ont oublié leur repas, alors nous avons partagé nos sandwichs.","Üç çocuk yemeğini unuttu, biz de sandviçlerimizi paylaştık.","n"],["Malheureusement, Léo a p /* ================= answer checking ================= */
const CODE={'e/':'é','e\\':'è','e^':'ê','e:':'ë','a\\':'à','a^':'â','u\\':'ù','u^':'û','i^':'î','i:':'ï','o^':'ô','c,':'ç'};

  for(const a of answers)if(norm(u)===norm(a))return {res:'ok',best:a};for(const a of answers)if(loose(u)===loose(a))return {res:'near',best:a};return {res:'no',best:answers[0]}}

    case 'build':return !!(c.ex&&c.ext)&&tokens(c.ex).length>=3&&tokens(c.ex).length<=12;case 'cloze':return !!clozeOf(c);case 'speak':return SPEECH.ok&&!['sayi','sayi3','fiyat'].includes(c.tag)&&!/\d/.test(c.fr)&&tokens(cleanSay(c.fr)).length<=10}return false}

}
function bindGrades(it,c){document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;answer(it,c,g,g===1?'no':g===2?'near':'ok','',true);next()})}
function answer(it,c,g,res,ans,noRender){const s=cur_();const due=grade(c.id,g);record(c.id,it.m,res,ans);
  if(g===1){s.miss++;if(!s.wrong.includes(c.id))s.wrong.push(c.id)}else s.ok++;
  if(s.kind!=='test'&&due<Date.now()+20*6e4){s.q.splice(Math.min(s.q.length,s.i+4),0,{id:c.id,m:pickMode(c,'relearn')})}
  s.u_t=Date.now();scheduleWrite();if(!noRender){S.phase='a';rSession()}}
function doCheck(){const it=cur_().q[cur_().i],c=byId[it.id],u=$('ans').value;if(!u.trim())return;const r=check(u,c,c.ask[0].a);S.res=Object.assign(r,{user:u});
  answer(it,c,r.res==='no'?1:3,r.res,u);sayCard(r.best)}
function next(){stopAudio();speechStop();const s=cur_();s.i++;S.q=null;
  if(s.i>=s.q.length){const k=dayKey(Date.now());if(!P.days.includes(k)){P.days.push(k);P.days=P.days.slice(-90)}
    if(s.kind==='test'){P.tests.push({t:Date.now(),u:s.u,n:s.q.length,ok:s.ok});P.tests=P.tests.slice(-60)}
    S={view:'done',last:s};P.sess=null;scheduleWrite();flush();return render()}
  s.u_t=Date.now();scheduleWrite();render()}
function rDone(){const s=S.last,more=dueList().length+newList().length,test=s.kind==='test';const pct=Math.round(100*s.ok/Math.max(1,s.ok+s.miss));
  $('screen').innerHTML=`<div class="top"><h1>${test?'Test bitti · Ünite '+s.u:'Oturum bitti'}</h1></div>
   <div class="panel"><div class="count">${test?'%'+Math.round(100*s.ok/s.q.length):s.ok}<span>${test?`${s.ok} / ${s.q.length} doğru`:`doğru · ${s.miss} yanlış (%${pct})`}</span></div>
   ${s.wrong.length?`<div><h2>Yanlış yaptıkların</h2><div class="list">${s.wrong.map(id=>{const c=byId[id];return `<div class="item"><div><div class="t">${esc(c.fr)}</div><div class="s">${esc(c.tr)}</div></div><button class="say sm" data-say="${esc(c.fr)}" aria-label="Dinle">${I.say}</button></div>`}).join('')}</div></div>`:''}
   ${!test&&more?'<button class="big-btn" id="more">Devam et</button>':''}${s.kind==='practice'&&s.cfg?'<button class="big-btn" id="again">Bir tur daha</button>':''}${s.wrong.length?'<button class="btn" id="redo">Yanlışlarımı tekrar çalış</button>':''}<button class="btn" id="home">Ana ekrana dön</button></div>`;
  if($('more'))$('more').onclick=()=>startSession('daily',buildDaily());
  if($('again'))$('again').onclick=()=>{S={view:'free',f:s.cfg};S.f=s.cfg;render();$('fgo').click()};
  if($('redo'))$('redo').onclick=()=>startSession('practice',s.wrong.map(id=>({id,m:pickMode(byId[id],'relearn')})));
  $('home').onclick=()=>{S={view:'home'};render()}}

/* ================= TEKRAR: progress & records ================= */
function rStats(){
  const days=[...Array(14)].map((_,i)=>{const t=Date.now()-(13-i)*DAY,k=dayKey(t),d=P.daily[k]||[0,0];return {k,t,n:d[0],ok:d[1]}});const mx=Math.max(10,...days.map(d=>d.n));
  const byM={};P.log.forEach(l=>{const a=byM[l.m]||(byM[l.m]=[0,0]);a[0]++;if(l.r!=='no')a[1]++});
  const hard=Object.keys(P.c).filter(id=>byId[id]&&(P.c[id].no||0)>0).sort((a,b)=>(P.c[b].no-(P.c[b].ok||0)*.3)-(P.c[a].no-(P.c[a].ok||0)*.3)).slice(0,12);
  const recent=P.log.slice(-25).reverse();
  const fmtD=t=>{const d=new Date(t);return d.getDate()+' '+['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][d.getMonth()]};
  $('screen').innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Geri">${I.back}</button><h1 class="grow">İlerleme ve kayıtlar</h1></div>
   <section><h2>Son 14 gün · günlük cevap sayısı</h2><div class="chart" id="chart" role="group" aria-label="Son 14 günün cevap sayıları">${days.map((d,i)=>`<button data-d="${i}" aria-label="${fmtD(d.t)}: ${d.n} cevap, ${d.n?Math.round(100*d.ok/d.n):0}% doğru"><div class="b${d.n?'':' zero'}" style="height:${Math.round(100*d.n/mx)}%"></div></button>`).join('')}</div>
     <div class="axis">${days.map((d,i)=>`<span>${i%2?'':new Date(d.t).getDate()}</span>`).join('')}</div><div class="tip muted" id="tip">Bir çubuğa dokun: o günün sayıları.</div></section>
   <section><h2>Soru türüne göre</h2><div class="list">${Object.keys(TYPES).filter(m=>byM[m]).map(m=>`<div class="item"><div>${TYPES[m]}</div><div class="num">${byM[m][0]} cevap · %${Math.round(100*byM[m][1]/byM[m][0])}</div></div>`).join('')||'<div class="item muted">Henüz kayıt yok.</div>'}</div><div class="muted small" style="margin-top:6px">Son ${P.log.length} cevaba göre.</div></section>
   <section><h2>Testlerin</h2><div class="list">${[...P.tests].reverse().slice(0,10).map(t=>`<div class="item"><div>Ünite ${t.u} <span class="muted small">· ${fmtD(t.t)}</span></div><div class="num">%${Math.round(100*t.ok/t.n)} · ${t.ok}/${t.n}</div></div>`).join('')||'<div class="item muted">Henüz test yok. Ana ekrandaki "Kendini sına" ile başla.</div>'}</div></section>
   <section><h2>En çok zorlandıkların</h2><div class="list">${hard.map(id=>{const c=byId[id],r=P.c[id];return `<div class="item"><div><div class="t">${esc(c.fr)}</div><div class="s">${esc(c.tr)}</div></div><div class="num"><span class="noc">${r.no}✗</span> <span class="okc">${r.ok||0}✓</span></div></div>`}).join('')||'<div class="item muted">Henüz yok.</div>'}</div>${hard.length?'<button class="btn" id="hardgo" style="margin-top:8px;width:100%">Bunları çalış</button>':''}</section>
   <section><h2>Son cevapların</h2><div class="list">${recent.map(l=>{const c=byId[l.id];if(!c)return '';const d=new Date(l.t);return `<div class="item"><div><div class="t" style="font-size:1.1rem">${esc(c.fr)}</div><div class="s">${TYPES[l.m]||l.m} · ${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}${l.a?' · sen: '+esc(l.a):''}</div></div><span class="${l.r==='no'?'noc':'okc'}" style="font-weight:700">${l.r==='no'?'✗':'✓'}</span></div>`}).join('')||'<div class="item muted">Henüz kayıt yok.</div>'}</div></section>`;
  $('bk').onclick=()=>{S={view:'home'};render()};
  $('chart').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;document.querySelectorAll('#chart [data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b));const d=days[+b.dataset.d];$('tip').textContent=`${fmtD(d.t)}: ${d.n} cevap${d.n?`, %${Math.round(100*d.ok/d.n)} doğru`:''}`};
  if($('hardgo'))$('hardgo').onclick=()=>startSession('practice',hard.map(id=>({id,m:pickMode(byId[id],'relearn')})))}

/* ================= OKU-DİNLE ================= */
const KCLASS={'Klasik':'k1','Gerçek metin':'k2'};
function rLib(){const units=[...new Set(BOOK.map(s=>s.u))].sort((a,b)=>b-a);
  const tasks=TASKS.map(T=>{const n=T.groups.reduce((a,g)=>a+g.items.length,0),heard=T.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>P.tc[T.id+':'+gi+':'+ii]).length,0);return `<button class="item" data-task="${esc(T.id)}"><div style="min-width:0"><span class="chip k3">Görev</span><div class="t" style="font-family:var(--ui);font-size:1.0625rem;font-weight:600">${esc(T.title)}</div><div class="s">${n} kayıt${heard?` · ${heard} tanesi dinlendi`:''}</div></div><span class="muted">›</span></button>`}).join('');
  $('screen').innerHTML=`<div class="top"><h1>Oku-Dinle</h1></div>`+(TASKS.length?`<section><h2>Görevler · ödev ve test dinlemeleri</h2><div class="list">${tasks}</div></section>`:'')+units.map(u=>`<section><h2>Ünite ${u}</h2><div class="list">${BOOK.map((s,i)=>[s,i]).filter(([s])=>s.u===u).map(([s,i])=>{const rd=P.read.includes(s.title),pos=P.rpos[s.title];return `
     <button class="item" data-s="${i}"><div style="min-width:0"><span class="chip ${KCLASS[s.kind]||''}">${esc(s.kind)}</span><div class="t">${esc(s.title)}</div><div class="s">${esc(s.tr_title)} · ${s.lines.length} cümle${Object.keys(s.speakers).length>1?' · diyalog':''}${!rd&&pos?' · yarım kaldı':''}</div></div><span class="${rd?'done-mark':'muted'}">${rd?'✓':'›'}</span></button>`}).join('')}</div></section>`).join('');
  $('screen').onclick=e=>{const tk=e.target.closest('[data-task]');if(tk){ctx();pack('t.mp3');R={view:'task',id:tk.dataset.task};render();return}const b=e.target.closest('[data-s]');if(!b)return;ctx();pack('s'+b.dataset.s+'.mp3');const i=+b.dataset.s,pos=P.rpos[BOOK[i].title]||{};R={view:'story',i,step:pos.step||1,line:pos.line||0,playing:false,tr:false,slow:false,listens:0};render()}}
function rTask(){const T=TASKS.find(x=>x.id===R.id);if(!T){R={view:'lib'};return render()}
  $('screen').innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Görevlere dön">${I.back}</button><h1 class="grow">${esc(T.title)}</h1></div><p class="muted">${esc(T.note)}</p>`
   +T.groups.map((g,gi)=>`<section><h2>${esc(g.name)}</h2><div class="list">${g.items.map((it,ii)=>{const k=T.id+':'+gi+':'+ii,n=P.tc[k]||0;return `<div class="item" style="grid-template-columns:auto minmax(0,1fr) auto auto"><span class="num" style="width:1.6em;font-size:1.25rem;color:var(--accent)">${ii+1}</span><span class="muted small" id="tc-${gi}-${ii}">${n?n+' kez dinlendi'+(n>=3?' · bitti':''):'dinlenmedi'}</span><button class="say sm" data-tk="${gi}:${ii}" aria-label="${ii+1}. kaydı dinle">${I.say}</button><button class="say sm" data-tk="${gi}:${ii}" data-slow="1" aria-label="${ii+1}. kaydı yavaş dinle" style="font-size:.6875rem;font-weight:700">yavaş</button></div>`}).join('')}</div></section>`).join('')
   +`<p class="muted small">Sayaç sadece hatırlatma içindir; 3'ten sonra da çalar.</p>`;
  $('bk').onclick=()=>{stopAudio();R={view:'lib'};render()};
  $('screen').onclick=e=>{const b=e.target.closest('[data-tk]');if(!b)return;e.stopPropagation();const [gi,ii]=b.dataset.tk.split(':').map(Number),it=T.groups[gi].items[ii],k=T.id+':'+gi+':'+ii;
    P.tc[k]=(P.tc[k]||0)+1;scheduleWrite();const n=P.tc[k];$('tc-'+gi+'-'+ii).textContent=n+' kez dinlendi'+(n>=3?' · bitti':'');
    const slow=!!b.dataset.slow,e1=(slow&&TIDX[`1.4|${it.v}|${it.t}`])||TIDX[`1.0|${it.v}|${it.t}`];if(!e1)return;playClip('t.mp3',e1[0],e1[1])}}
function savePos(){const s=BOOK[R.i];P.rpos[s.title]={step:R.step,line:R.line,t:Date.now()};scheduleWrite()}
function markGloss(text,gloss){let h=esc(text);gloss.forEach(([w])=>{const ew=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');h=h.replace(new RegExp('(^|[^\\p{L}])('+ew+')(?=[^\\p{L}]|$)','iu'),(m,a,b)=>a+'<span class="gw" data-w="'+esc(w)+'">'+b+'</span>')});return h}
function rStory(){const s=BOOK[R.i];let body='';const multi=Object.keys(s.speakers).filter(k=>s.speakers[k].label).length>0;
  if(R.step===1)body=`<div class="listen"><div class="kind">1. adım · metne bakmadan dinle</div><div class="t">${esc(s.title)}</div><div class="muted">İki kez dinle. Ne anladığını kendine Türkçe anlat, sonra okumaya geç.${multi?' Bu bir diyalog: her kişinin sesi farklı.':''}</div><div class="muted small">${R.listens} kez dinlendi</div></div><button class="btn" id="toRead">Okuyarak dinle ›</button>`;
  else if(R.step===2)body=`<div class="lines2" id="lines">${s.lines.map((l,j)=>{const sp=l[2]!=='n'?s.speakers[l[2]]:null;const prev=j?s.lines[j-1][2]:null;return `<div class="line${j===R.line&&R.playing?' on':''}" data-l="${j}">${sp&&sp.label&&prev!==l[2]?`<div class="who v-${sp.voice}">${esc(sp.label)}</div>`:''}<div class="f">${markGloss(l[0],s.gloss)}</div>${R.tr?`<div class="tr">${esc(l[1])}</div>`:''}</div>`}).join('')}</div><p class="muted small">Cümleye dokun: oradan çalar. Altı noktalı kelimeye dokun: anlamı çıkar.</p>`;
  else body=`<ol class="qs">${s.qs.map((q,j)=>`<li><div>${j+1}. ${esc(q[0])}</div><button class="btn" data-qa="${j}" style="align-self:flex-start">Cevabı göster</button><div class="a" id="qa${j}" hidden>${esc(q[1])}</div></li>`).join('')}</ol><button class="big-btn" id="fin">Bitirdim</button>`;
  $('screen').innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Kitaplığa dön">${I.back}</button><div class="grow"><div style="font-family:var(--fr);font-size:1.4rem;line-height:1.1">${esc(s.title)}</div><div class="muted small">${esc(s.tr_title)}</div></div>${R.step===2?`<button class="btn" id="trb" aria-pressed="${R.tr}" style="padding:6px 10px">${R.tr?'TR gizle':'TR'}</button>`:''}</div>
    <div class="steps" id="steps">${['Dinle','Oku','Sorular'].map((n,j)=>`<button data-st="${j+1}" aria-pressed="${R.step===j+1}">${j+1}. ${n}</button>`).join('')}</div>`+body;
  $('playerSlot').innerHTML=R.step<3?`<div class="player"><button id="pRep" aria-label="Cümleyi tekrarla">${I.again}</button><button id="pPrev" aria-label="Önceki cümle">${I.prev}</button><button class="main" id="pPlay" aria-label="${R.playing?'Durdur':'Oynat'}">${R.playing?I.pause:I.play}</button><button id="pNext" aria-label="Sonraki cümle">${I.next}</button><button class="spd" id="pSpd" aria-label="Hız">${R.slow?'Yavaş':'Normal'}</button></div>`:'';
  $('bk').onclick=()=>{stopAudio();savePos();R={view:'lib'};render()};
  $('steps').onclick=e=>{const b=e.target.closest('[data-st]');if(!b)return;stopAudio();R.playing=false;R.step=+b.dataset.st;R.line=0;savePos();rStory()};
  if($('toRead'))$('toRead').onclick=()=>{stopAudio();R.playing=false;R.step=2;R.line=0;savePos();rStory()};
  if($('trb'))$('trb').onclick=()=>{R.tr=!R.tr;rStory()};
  if($('lines'))$('lines').onclick=e=>{const w=e.target.closest('[data-w]');if(w){e.stopPropagation();const g=s.gloss.find(x=>x[0]===w.dataset.w);showSheet(`<div class="w">${esc(g[0])}</div><div class="tr-big">${esc(g[1])}</div><div class="row"><button class="btn grow" id="shSay">Dinle</button><button class="btn grow" id="shClose">Kapat</button></div>`,()=>sayStory(R.i,g[0],false));return}
    const l=e.target.closest('[data-l]');if(l){R.line=+l.dataset.l;playFrom()}};
  document.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{$('qa'+b.dataset.qa).hidden=false;b.hidden=true});
  if($('fin'))$('fin').onclick=()=>{if(!P.read.includes(s.title))P.read.push(s.title);delete P.rpos[s.title];scheduleWrite();R={view:'lib'};render()};
  if($('pPlay')){$('pPlay').onclick=()=>{if(R.playing){stopAudio();R.playing=false;savePos();rStory()}else{if(R.step===1&&R.line===0)R.listens++;playFrom()}};
    $('pRep').onclick=()=>{R.playing=false;hl();sayStory(R.i,s.lines[R.line][0],R.slow)};
    $('pPrev').onclick=()=>{R.line=Math.max(0,R.line-1);playFrom()};
    $('pNext').onclick=()=>{R.line=Math.min(s.lines.length-1,R.line+1);playFrom()};
    $('pSpd').onclick=()=>{R.slow=!R.slow;$('pSpd').textContent=R.slow?'Yavaş':'Normal'}}
  if(R.step===2&&R.line>0&&!R.playing)setTimeout(hl,50)}
function hl(){document.querySelectorAll('.line').forEach(el=>el.classList.toggle('on',+el.dataset.l===R.line));const on=document.querySelector('.line.on');if(on)on.scrollIntoView({block:'center',behavior:'smooth'})}
function playFrom(){const s=BOOK[R.i];R.playing=true;const b=$('pPlay');if(b){b.innerHTML=I.pause;b.setAttribute('aria-label','Durdur')}hl();
  sayStory(R.i,s.lines[R.line][0],R.slow,ok=>{if(!R.playing)return;if(!ok){R.playing=false;rStory();return}if(R.line<s.lines.length-1){R.line++;savePos();setTimeout(()=>{if(R.playing)playFrom()},450)}else{R.playing=false;R.line=0;savePos();rStory()}})}
function showSheet(h,onSay){$('sheetBody').innerHTML=h;$('sheet').hidden=false;if($('shClose'))$('shClose').onclick=hideSheet;if($('shSay')&&onSay)$('shSay').onclick=onSay}
function hideSheet(){$('sheet').hidden=true}

/* ================= global ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();sayCard(b.dataset.say,!!b.dataset.slow)}},true);
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
document.addEventListener('keydown',e=>{if(tab!=='tekrar'||S.view!=='session'||e.target.tagName==='INPUT')return;
  if(S.phase==='a'&&['1','2','3'].includes(e.key)){const g=document.querySelector(`[data-g="${e.key}"]`);if(g){g.click();return}}
  if(S.phase==='q'&&['1','2','3','4'].includes(e.key)){const o=document.querySelector(`[data-o="${+e.key-1}"]`);if(o){o.click();return}}
  if(e.key===' '||e.key==='Enter'){const b=$('show')||$('go')||$('chkb');if(b){e.preventDefault();b.click()}else if($('flip')){e.preventDefault();$('flip').click()}}
  if(e.key==='r'||e.key==='R'){const it=P.sess.q[P.sess.i],c=byId[it.id];sayCard(it.m==='dict'?c.ask[0].a[0]:c.fr)}});
window.addEventListener('hashchange',()=>{if(/^#(tekrar|oku)$/.test(location.hash)&&location.hash.slice(1)!==tab)setTab(location.hash.slice(1))});
render();
</script>
