function xTimer(EX,st,b){if(EX.tur!=='sinav'||!b.sure)return null;if(!st.son[b.id]){st.son[b.id]=Date.now()+b.sure*1000;xSave(st)}return st.son[b.id]}
function xNextSection(EX,st,msg){stopAudio();akRecStop();if(msg)toast(msg);if(st.bi<EX.bolumler.length-1){st.bi++;xSave(st);render()}else{st.bitti=Date.now();xSave(st);AS={view:'son',id:EX.id};render()}}
/* Sınav çerçevesi (bilgisayarlı TCF'ye benzer): menü gizli; üstte bölüm, soru no ve kalan süre; ortada soru; altta bilgi ve düğmeler.
   Yazılar sınavdaki gibi Fransızca (Question, Temps restant, Suivant), açıklamalar Türkçe. */
let XDL=null,XOTO=null;
async function xRun(){const EX=await exLoad(AS.id),st=xState(EX.id);if(!st){AS={view:'giris',id:EX.id};return render()}
  $('nav').hidden=true;const b=EX.bolumler[st.bi];XDL=xTimer(EX,st,b);
  if(XDL&&XDL<=Date.now())return xNextSection(EX,st,'Süre doldu: '+b.ad+' kapandı.');
  const R={co:xCO,ce:xCE,kisa:xKisa,ee:xEE,eo:xEO}[b.tip]||xKisa;R(EX,st,b);
  if(XDL)AKT=setInterval(()=>{const r=(XDL-Date.now())/1000,c=$('akclk');if(c){c.querySelector('b').textContent=fmtT(r);c.classList.toggle('az',r<60)}if(r<=0){akStop();xNextSection(EX,st,'Süre doldu: '+b.ad+' kapandı.')}},500);
  $('akq').onclick=()=>{stopAudio();akRecStop();AS={view:'giris',id:EX.id};render()};
  document.querySelectorAll('[data-sec]').forEach(x=>x.onclick=()=>{stopAudio();akRecStop();st.bi=+x.dataset.sec;xSave(st);render()})}
const svSon=(EX,st)=>st.bi<EX.bolumler.length-1?'Section suivante →':'Terminer →';
const svSeg=(n,i,ok)=>`<div class="sv-seg" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k===i?'su':ok(k)?'ok':''}"></i>`).join('')}</div>`;
function svCiz(EX,st,b,o){const sinav=EX.tur==='sinav',L=EX.bolumler.length;$('screen').classList.add('sv-ekran');
  $('screen').innerHTML=`<div class="sv"><header class="sv-ust"><div class="sv-satir">
     <div class="sv-bolum"><span class="kind">${esc(EX.baslik)}<span class="pc"> · Bölüm ${st.bi+1} / ${L}</span></span><b>${esc(b.ad)}${b.tr?` <span class="tr"><i>· </i>${esc(b.tr)}</span>`:''}</b></div>
     ${o.no?`<div class="sv-no">${o.no}</div>`:''}
     ${XDL?`<div class="sv-sure" id="akclk"><small>Temps restant</small><b>${fmtT((XDL-Date.now())/1000)}</b></div>`:''}
     <button class="icon" id="akq" aria-label="Sınavdan çık" title="Çık">${I.x}</button></div>
    <div class="sv-mobil-no"><span>Bölüm ${st.bi+1} / ${L}</span>${o.no?`<span class="sv-no">${o.no}</span>`:''}</div>
    ${sinav?'':`<div class="seg sv-bolumler">${EX.bolumler.map((x,i)=>`<button data-sec="${i}" aria-pressed="${i===st.bi}">${esc(x.tr||x.ad)}</button>`).join('')}</div>`}
    ${o.seg||''}</header>
   <main class="sv-govde${o.genis?' genis':''}">${o.govde}</main>
   <footer class="sv-alt"><div class="bilgi">${o.bilgi||''}</div><div class="sv-dug" id="akeob">${o.dug||''}</div></footer></div>`}
function bindNext(EX,st){const n=$('aknext');if(n)n.onclick=()=>{if(EX.tur==='sinav'&&!confirm('Bu bölümü bitirirsen geri dönemezsin. Devam?'))return;akStop();xNextSection(EX,st)}}
function optsHtml(it,cur,dis){return `<div class="ak-opts" role="radiogroup">${it.secenekler.map((o,i)=>`<button class="ak-opt" role="radio" aria-checked="${cur===i}" data-opt="${i}" ${dis?'disabled':''}><span class="ak-let">${LET[i]}</span><span>${mdi(frb(o))}</span></button>`).join('')}</div>`}
function playItem(EX,it,slow,done){ctx();Promise.resolve().then(()=>{const e=(slow&&EX.sesIndex[it.id+'~y'])||EX.sesIndex[it.id];if(!e){toast('Bu kaydın sesi yok',true);return done&&done(false)}playClip('icerik/ses/e-'+EX.id+'.mp3',e[0],e[1],done)})}
function fb(it,v){if(it.dogru==null)return '';let ok;if(Array.isArray(it.dogru))ok=it.dogru.some(a=>norm(String(v||''))===norm(a)||loose(String(v||''))===loose(a));else ok=v===it.dogru;
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Doğru':'Yanlış'}</b>${ok?'':`<div>Doğrusu: ${Array.isArray(it.dogru)?esc(it.dogru[0]):LET[it.dogru]+') '+mdi(it.secenekler[it.dogru])}</div>`}${it.aciklama?`<div class="small">${mdi(it.aciklama)}</div>`:''}</div>`}
/* Dinleme sesinin yaklaşık ilerlemesi (klipler 48 kbit/sn mp3: süre ≈ bayt × 8 / 48000) */
let AKP=null;
function akIlerDur(){if(AKP){clearInterval(AKP);AKP=null}}
function svIlerle(sure){akIlerDur();const t0=Date.now();AKP=setInterval(()=>{const s=(Date.now()-t0)/1000,c=$('akil'),g=$('akgec');if(!c)return akIlerDur();
  c.style.width=Math.min(97,sure?s/sure*100:0)+'%';if(g)g.textContent=fmtT(Math.min(s,sure||s))},250)}
function optsBagla(EX,st,it){document.querySelectorAll('[data-opt]').forEach(x=>x.onclick=()=>{st.ans[it.id]=+x.dataset.opt;xSave(st);
  if(EX.tur==='alistirma')return render();document.querySelectorAll('[data-opt]').forEach(y=>y.setAttribute('aria-checked',y===x));const p=document.querySelector('.sv-pills .cur');if(p)p.classList.add('done')})}
/* --- Dinleme (CO): kayıt bir kez, soru kayıttan sonra --- */
function xCO(EX,st,b){const sinav=EX.tur==='sinav',qs=b.sorular,qi=Math.min(st.qi[b.id]||0,qs.length-1),it=qs[qi],max=sinav?1:(it.dinleme||3);
  const n=st.dinle[it.id]||0,faz=st.faz[it.id]||(it.ses?'dinle':'cevap'),showQ=!sinav||faz==='cevap'||!it.ses,cur=st.ans[it.id];
  const e=it.ses&&EX.sesIndex&&EX.sesIndex[it.id],sure=e?e[1]*8/48000:0;
  let ust='';
  if(it.ses&&sinav&&!showQ)ust=`<div class="sv-dinle"><div class="sv-kulak" id="akkulak">${I.kulak}</div><h2>Écoutez le document.</h2>
      <div class="muted" id="akls">Kayıt <b>bir kez</b> çalınır. Durdurulamaz, geri sarılamaz.</div>
      <div class="sv-ses"><span id="akgec">0:00</span><div class="c"><span id="akil"></span></div><span>${fmtT(sure)}</span></div>
      <button class="btn" id="akplay">Kaydı başlat</button></div><div class="sv-bekle">Soru ve şıklar kayıt bitince burada görünecek.</div>`;
  else if(it.ses&&sinav)ust=`<div class="sv-dinlendi"><span class="tik">✓</span><span>Document écouté. <span class="muted">Kayıt bir daha çalınmaz.</span></span></div>`;
  else if(it.ses)ust=`<div class="sv-dinle yatay"><button class="say ak-big" id="akplay" ${n>=max?'disabled':''} aria-label="Kaydı dinle">${I.say}</button>
      <div><div id="akls">${n} / ${max} dinleme</div>${n<max?'<button class="link small" id="akslow">yavaş dinle</button>':''}</div></div>`;
  svCiz(EX,st,b,{no:`Question <b>${qi+1}</b> / ${qs.length}`,seg:svSeg(qs.length,qi,k=>sinav?k<qi:st.ans[qs[k].id]!=null),
    govde:(b.talimat&&qi===0?`<div class="ak-note">${mdi(b.talimat)}</div>`:'')+ust+(it.metin?`<div class="ak-doc sv-belge">${mdr(frb(it.metin))}</div>`:'')+
      (showQ?`<p class="sv-soru">${mdi(frb(it.soru))}</p>${optsHtml(it,cur,false)}${EX.tur==='alistirma'&&cur!=null?fb(it,cur):''}`:''),
    bilgi:sinav?(showQ?'Cevabını seç, sonra <b>Suivant</b>. Dinleme bölümünde önceki sorulara dönülmez.':'Kayıt bir kez çalınır; soru kayıt bittikten sonra gelir.'):`Ödev: kaydı en fazla ${max} kez dinleyebilirsin; yavaş ses de var.`,
    dug:`${!sinav&&qi?'<button class="btn" id="akpv">‹ Précédent</button>':''}<button class="big-btn" id="akqn" ${showQ?'':'disabled'}>${qi<qs.length-1?'Suivant →':svSon(EX,st)}</button>`});
  const doPlay=slow=>{if((st.dinle[it.id]||0)>=max)return;st.dinle[it.id]=(st.dinle[it.id]||0)+1;xSave(st);const p=$('akplay');
    if(sinav){if(p)p.hidden=true;$('akls').textContent='Dinleniyor… Kayıt bitince soru gelecek.';$('akkulak').classList.add('calar');svIlerle(sure)}else{if(p){p.disabled=true;p.classList.add('on')}$('akls').textContent='Dinleniyor…'}
    playItem(EX,it,slow,ok=>{akIlerDur();if(!ok){st.dinle[it.id]--;XOTO=it.id;xSave(st)}else{st.faz[it.id]='cevap';xSave(st)}if(AS.view==='kos')render()})};
  if($('akplay'))$('akplay').onclick=()=>doPlay(false);if($('akslow'))$('akslow').onclick=()=>doPlay(true);
  optsBagla(EX,st,it);
  if($('akpv'))$('akpv').onclick=()=>{stopAudio();st.qi[b.id]=qi-1;xSave(st);render()};
  $('akqn').onclick=()=>{stopAudio();if(qi<qs.length-1){st.qi[b.id]=qi+1;xSave(st);render()}else{if(sinav&&!confirm('Dinleme bölümü bitiyor. Devam?'))return;akStop();xNextSection(EX,st)}};
  // Sınavda kayıt kendiliğinden başlar (ses çalınamadıysa bir daha kendiliğinden denemez; "Kaydı başlat" düğmesi kalır)
  if(sinav&&it.ses&&faz==='dinle'&&n===0&&XOTO!==it.id){$('akls').textContent='Kayıt 2 saniye içinde başlıyor…';setTimeout(()=>{if(AS.view==='kos'&&$('akplay')&&!(st.dinle[it.id]))doPlay(false)},2000)}}
/* --- Okuma (CE): belge ve soru aynı ekranda (PC'de yan yana); numaralarla istediğin soruya git --- */
function xCE(EX,st,b){const sinav=EX.tur==='sinav',qs=b.sorular,qi=Math.min(st.qi[b.id]||0,qs.length-1),it=qs[qi],cur=st.ans[it.id],son=qi>=qs.length-1;
  const soru=`<p class="sv-soru">${mdi(frb(it.soru))}</p>${optsHtml(it,cur,false)}${EX.tur==='alistirma'&&cur!=null?fb(it,cur):''}`;
  svCiz(EX,st,b,{no:`Question <b>${qi+1}</b> / ${qs.length}`,genis:!!it.metin,
    seg:`<div class="sv-pills" aria-label="Sorular">${qs.map((q,i)=>`<button data-q="${i}" class="${i===qi?'cur':''}${st.ans[q.id]!=null?' done':''}" aria-label="Soru ${i+1}">${i+1}</button>`).join('')}</div>`,
    govde:(b.talimat&&qi===0?`<div class="ak-note">${mdi(b.talimat)}</div>`:'')+(it.metin?`<div class="sv-okuma"><div class="ak-doc sv-belge">${mdr(frb(it.metin))}</div><div class="sv-sag">${soru}</div></div>`:soru),
    bilgi:'Belgeyi oku, soruyu cevapla. Üstteki numaralarla sorular arasında gidip gelebilirsin.',
    dug:`<button class="btn" id="akpv" ${qi?'':'disabled'}>‹ Précédent</button><button class="big-btn" id="aknx">${son?svSon(EX,st):'Suivant →'}</button>`});
  document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{st.qi[b.id]=+x.dataset.q;xSave(st);render()});
  optsBagla(EX,st,it);
  $('akpv').onclick=()=>{st.qi[b.id]=qi-1;xSave(st);render()};
  $('aknx').onclick=()=>{if(!son){st.qi[b.id]=qi+1;xSave(st);return render()}const bos=qs.filter(q=>st.ans[q.id]==null).length;
    if(sinav&&!confirm((bos?bos+' soru boş. ':'')+'Bu bölümü bitirirsen geri dönemezsin. Devam?'))return;akStop();xNextSection(EX,st)}}
/* --- Kısa cevap / dikte / dil yapısı: bütün sorular bir sayfada --- */
function xKisa(EX,st,b){const sinav=EX.tur==='sinav';
  svCiz(EX,st,b,{no:`<b>${b.sorular.length}</b> questions`,bilgi:'Bütün sorular bu sayfada. Bitirince sonraki bölüme geç.',dug:`<button class="big-btn" id="aknext">${svSon(EX,st)}</button>`,
   govde:(b.talimat?`<div class="ak-note">${mdi(b.talimat)}</div>`:'')+b.sorular.map((it,i)=>{const n=st.dinle[it.id]||0,max=sinav?1:(it.dinleme||3);
    return `<div class="card ak-q ak-kisa"><div class="ak-soru"><span class="ak-no">${i+1}.</span> ${mdi(it.soru||'')}</div>
     ${it.ses?`<div class="row"><button class="say" data-play="${esc(it.id)}" ${n>=max?'disabled':''} aria-label="Dinle">${I.say}</button><span class="muted small" id="pc-${esc(it.id)}">${n} / ${max} dinleme</span></div>`:''}
     ${it.secenekler?optsHtml(it,st.ans[it.id],false).replace(/data-opt="/g,`data-for="${esc(it.id)}" data-opt="`):`<input class="answer ak-in" data-in="${esc(it.id)}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.ans[it.id]||'')}" placeholder="${esc(it.ipucu||'Cevabın')}">`}
     ${EX.tur==='alistirma'&&st.ans[it.id]!=null&&st.ans[it.id]!==''&&st.chk&&st.chk[it.id]?fb(it,st.ans[it.id]):''}</div>`}).join('')

  $('screen').querySelectorAll('[data-in]').forEach(x=>x.oninput=()=>{st.ans[x.dataset.in]=x.value;xSave(st)});
  $('screen').querySelectorAll('[data-for]').forEach(x=>x.onclick=()=>{st.ans[x.dataset.for]=+x.dataset.opt;xSave(st);$('screen').querySelectorAll(`[data-for="${x.dataset.for}"]`).forEach(y=>y.setAttribute('aria-checked',y===x))});
  $('screen').querySelectorAll('[data-play]').forEach(x=>x.onclick=()=>{const it=b.sorular.find(q=>q.id===x.dataset.play),max=sinav?1:(it.dinleme||3);if((st.dinle[it.id]||0)>=max)return;
    st.dinle[it.id]=(st.dinle[it.id]||0)+1;xSave(st);const n=st.dinle[it.id];$('pc-'+it.id).textContent=n+' / '+max+' dinleme';if(n>=max)x.disabled=true;playItem(EX,it,false,()=>{})});

/* --- Yazma (EE): TCF kelime sayacı (iki boşluk arası = 1 kelime), sınır ölçeği, Fransızca harf düğmeleri --- */
const HARFLER='é è ê à â ç ù û î ô ë ï œ É À Ç « »'.split(' ');
const sinirTxt=x=>x.min||x.max?' / '+(x.min||0)+'–'+(x.max||'…'):'';
function xEE(EX,st,b){const sinav=EX.tur==='sinav',ts=b.gorevler,ti=Math.min(st.qi[b.id]||0,ts.length-1),g=ts[ti],v=st.ans[g.id]||'',son=ti>=ts.length-1;
  const MIN=g.min||0,MAX=g.max||0,OL=MAX?MAX*1.25:MIN*2,yz=x=>Math.min(100,x/OL*100)+'%';
  const sinir=MIN||MAX?`<span class="sv-sinir">${[MIN?MIN+' mots minimum':'',MAX?MAX+' mots maximum':''].filter(Boolean).join(' · ')}</span>`:'';
  svCiz(EX,st,b,{no:`Tâche <b>${ti+1}</b> / ${ts.length}`,genis:true,
    govde:`${ts.length>1?`<div class="sv-gorevler" role="tablist">${ts.map((x,i)=>`<button data-q="${i}" role="tab" aria-selected="${i===ti}">${esc(x.ad||'Tâche '+(i+1))} <small${i===ti?' id="akg"':''}>${wc(st.ans[x.id])}${sinirTxt(x)}</small></button>`).join('')}</div>`:''}
     <div class="sv-yazma"><div class="sv-sol"><div class="sv-gorev"><div class="kind">${esc(g.ad||'Tâche '+(ti+1))}</div><div class="ak-md">${mdr(frb(g.konu))}</div>${sinir}</div>
       <div class="sv-kural"><b>Kelimeler nasıl sayılır? (TCF kuralı)</b>İki boşluk arasındaki her şey 1 kelime.
        <ul><li><span class="f">c'est-à-dire</span> → 1 · <span class="f">l'école</span> → 1</li><li><span class="f">Je ne sais pas</span> → 4</li><li>Tek başına duran ! ? : sayılmaz.</li></ul></div></div>
      <div class="sv-editor"><div class="sv-harfler" aria-label="Fransızca harfler"><span>Harf ekle:</span>${HARFLER.map(h=>`<button type="button" data-harf="${h}">${h}</button>`).join('')}</div>
       <textarea id="akta" spellcheck="false" autocapitalize="sentences" aria-label="Metnin" placeholder="Metnini buraya yaz…">${esc(v)}</textarea>
       <div class="sv-kelimeler" id="akgor" hidden></div>
       <div class="sv-sayac"><div class="sv-sayac-ust"><span class="n" id="akn">0</span><span>mots</span><span class="ak-chip" id="akdurum" hidden></span></div>
        ${OL?`<div class="sv-olcek" aria-hidden="true"><div class="bolge" style="left:${yz(MIN)};width:calc(${yz(MAX||OL)} - ${yz(MIN)})"></div><div class="dolu" id="akdolu"></div>${MIN?`<span class="et" style="left:${yz(MIN)}">${MIN}</span>`:''}${MAX?`<span class="et" style="left:${yz(MAX)}">${MAX}</span>`:''}</div>`:''}
        <div class="sv-mesaj" id="akmsj"></div>
        <div class="sv-sayac-alt"><button class="link small" id="akgoster">Kelimeleri tek tek göster</button><span id="akkayit"></span></div></div></div></div>`,
    bilgi:sinav?'Görevler sırayla; süre hepsi için ortak. Sınırın dışında kalan metin puan kaybeder.':'Sınırın dışında kalan metin puan kaybeder.',
    dug:`<button class="big-btn" id="aknext">${son?svSon(EX,st):'Tâche suivante →'}</button>`});
  // Telefonda görevin Türkçe açıklaması (blockquote) kapalı başlar: yazı alanı ilk ekrana yaklaşsın
  const bq=document.querySelector('.sv-gorev .ak-md blockquote');if(bq){const ad=/^\s*Türkçe/.test(bq.textContent)?'Türkçesini':'Açıklamayı';
    bq.insertAdjacentHTML('beforebegin',`<button class="link small sv-trac" id="aktrac">${ad} göster</button>`);
    $('aktrac').onclick=()=>{const o=document.querySelector('.sv-gorev').classList.toggle('tr-acik');$('aktrac').textContent=ad+(o?' gizle':' göster')}}
  const ta=$('akta');let tm;

let REC=null;

function recMime(){const c=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];for(const m of c)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return ''}
function xEO(EX,st,b){const sinav=EX.tur==='sinav',ts=b.gorevler,ti=Math.min(st.qi[b.id]||0,ts.length-1),g=ts[ti],done=st.kayit[g.id];
  svCiz(EX,st,b,{no:`Tâche <b>${ti+1}</b> / ${ts.length}`,seg:svSeg(ts.length,ti,k=>!!st.kayit[ts[k].id]),
    govde:`<div class="card ak-q">${g.ad?`<div class="kind">${esc(g.ad)}</div>`:''}<div class="ak-md">${mdr(frb(g.konu))}</div>

    <div class="ak-rec" id="akrec">${done?`<div class="fb ok"><b>Kaydedildi</b><div class="small">${fmtT(done.sure)} konuşma</div></div><audio controls id="akpb"></audio>`:''}</div></div>`,
    bilgi:'Konuşma: görevi oku; hazır olunca kayda başla. Mikrofon izni gerekir.',
    dug:done?(!sinav?'<button class="btn" id="akredo">Yeniden kaydet</button>':'')+`<button class="big-btn" id="akeonx">${ti<ts.length-1?'Tâche suivante →':svSon(EX,st)}</button>`
      :`<button class="big-btn" id="akeogo">${g.hazirlik?'Hazırlığa başla':'Kayda başla'}</button>`});
  if(done)IDB.get(EX.id+'/'+g.id).then(bl=>{const a=$('akpb');if(a&&bl)a.src=URL.createObjectURL(bl)});
  if($('akeonx'))$('akeonx').onclick=()=>{if(ti<ts.length-1){st.qi[b.id]=ti+1;xSave(st);render()}else{akStop();xNextSection(EX,st)}};
  if($('akredo'))$('akredo').onclick=async()=>{delete st.kayit[g.id];await IDB.del(EX.id+'/'+g.id);st.faz[g.id]='hazir';xSave(st);render()};
  const startRec=async()=>{let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Mikrofon açılamadı: '+(e.name||e),true);return}
    const mime=recMime();let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){mr=new MediaRecorder(stream)}
    const chunks=[],t0=Date.now(),lim=(g.sure||120)*1000;REC={mr,keep:true};mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(REC.iv);if(REC.cancel){REC=null;return}const bl=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});
      await IDB.put(EX.id+'/'+g.id,bl);st.kayit[g.id]={sure:Math.round((Date.now()-t0)/1000),mime:bl.type,boyut:bl.size};st.faz[g.id]='tamam';xSave(st);REC=null;if(AS.view==='kos')render()};
    mr.start(1000);
    $('akrec').innerHTML=`<div class="ak-recbox"><span class="ak-dot"></span><b>Kayıt</b> <span id="akrt">${fmtT(lim/1000)}</span></div>`;$('akeob').innerHTML='<button class="big-btn" id="akstop">Konuşmayı bitir</button>';
    $('akstop').onclick=()=>{REC.keep=true;mr.stop()};
    REC.iv=setInterval(()=>{const r=(lim-(Date.now()-t0))/1000;const e=$('akrt');if(e)e.textContent=fmtT(r);if(r<=0){clearInterval(REC.iv);if(mr.state!=='inactive')mr.stop()}},250)};
  const go=$('akeogo');if(go)go.onclick=()=>{ctx();const afterPrompt=()=>{if(g.hazirlik){let left=g.hazirlik;st.faz[g.id]='hazirlik';$('akrec').innerHTML=`<div class="ak-recbox prep"><b>Hazırlık</b> <span id="akpt">${fmtT(left)}</span></div>`;
      $('akeob').innerHTML='<button class="big-btn" id="akready">Hazırım, kayda başla</button>';const iv=setInterval(()=>{left--;const e=$('akpt');if(e)e.textContent=fmtT(left);if(left<=0){clearInterval(iv);startRec()}},1000);
      $('akready').onclick=()=>{clearInterval(iv);startRec()}}else startRec()};
    if(g.ses){$('akrec').innerHTML='<div class="muted">Sınav görevlisi konuşuyor…</div>';playItem(EX,g,false,()=>afterPrompt())}else afterPrompt()}}

   <div id="aklog" class="diag" hidden></div><div class="spacer"></div><div class="bottom">${sent||alis?'':`<button class="big-btn" id="aksend" ${GH.ok()?'':'disabled'}>Teslim et</button>`}${alis?'':'<button class="btn" id="akdl">Dosyaları indir</button>'}${EX.tur!=='sinav'&&!sent?'<button class="btn" id="akbackx">Cevaplara geri dön</button>':''}</div>`;

    dl(EX.id+'-cevaplar.json',new Blob([pk.json],{type:'application/json'}));for(const f of pk.files)dl(EX.id+'-'+f.ad,f.blob)};

    try{const pk=await xPackage(EX,st);const dir=`teslimler/${EX.id}/${pk.stamp}`;
      for(const f of pk.files){L('Yükleniyor: '+f.ad+' ('+Math.round(f.blob.size/1024)+' KB)');await GH.put(dir+'/'+f.ad,await b64blob(f.blob),`Teslim: ${EX.id} ${f.ad}`)}
      L('Yükleniyor: cevaplar.json');await GH.put(dir+'/cevaplar.json',b64txt(pk.json),`Teslim: ${EX.id}`);
      st.gonderildi=Date.now();st.yol=dir;xSave(st);L('Tamam ✓');toast('Teslim edildi');setTimeout(()=>{if(AS.view==='son')render()},800)}
    catch(e){L('Hata: '+e.message);btn.disabled=false;toast('Teslim edilemedi: '+e.message,true)}}}
async function xPackage(EX,st){const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'),files=[],kay={};
  for(const [k,v] of Object.entries(st.kayit||{})){const bl=await IDB.get(EX.id+'/'+k);if(!bl)continue;const ext=/mp4|m4a|aac/.test(bl.type)?'m4a':/ogg/.test(bl.type)?'ogg':'webm';const ad=k+'.'+ext;files.push({ad,blob:bl});kay[k]=Object.assign({dosya:ad},v)}
  const json=JSON.stringify({id:EX.id,baslik:EX.baslik,tur:EX.tur,uygulama:AKV,cihaz:navigator.userAgent,basla:new Date(st.basla).toISOString(),bitis:new Date(st.bitti||Date.now()).toISOString(),

  return {stamp,files,json}}

/* =============== BUGÜN (Tekrar sekmesinin ana ekranı): ünitenin 6 günlük planı, tek "Başla" ===============
   Plan: icerik/plan.json. durum "bekle" → her gün "bekle" işleri; "aktif" → gunler[i].isler (+ hafta sonu uzun).
   Gün takvime değil işe göre ilerler: bugünkü gün = temel işleri bitmemiş ilk gün (atlanan gün kayar).
   Biten işler bu cihazda (ak-bugun). Kart ve sınav işleri kendiliğinden işaretlenir; diğerleri dokunarak. */
let PLANJ=null,PLANY=false;
const GUNAD=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],GUNK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const ISTUR={kart:'Kart',ders:'Ders',alistirma:'Alıştırma',dinleme:'Dinleme',odev:'Ödev',test:'Test',konusma:'Konuşma'};
function bgYukle(){if(PLANY)return;PLANY=true;jget('icerik/plan.json').then(j=>{PLANJ=j;if(tab==='tekrar'&&S.view==='home')render()}).catch(()=>{PLANY=false})}
const bgGun=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function bgKayit(){const k=AKLS.get('ak-bugun',null),pid=PLANJ?PLANJ.unite+'|'+PLANJ.durum:'';return k&&k.plan===pid?k:{plan:pid,bitti:{},gun:{},acik:null}}
const bgOto=it=>it.ac==='kart'||/^sinav:/.test(it.ac||'');
function bgDurum(d,n){const k=bgKayit(),bk=bgGun(),hs=[0,6].includes(new Date().getDay()),G=(PLANJ&&PLANJ.gunler)||[],aktif=PLANJ&&PLANJ.durum==='aktif'&&G.length>0;
  const bitti=it=>{if(it.ac==='kart'&&d+n===0)return true;const m=/^sinav:(.+)$/.exec(it.ac||'');if(m){const s=xState(m[1]);if(s&&s.gonderildi)return true}
    return aktif?!!k.bitti[it.id]:!!(k.gun[bk]&&k.gun[bk][it.id])};
  let gi=0,isler=[],uzun=[];
  if(aktif){gi=G.findIndex(g=>!g.isler.every(bitti));if(gi<0)gi=G.length;else{isler=G[gi].isler;uzun=G[gi].uzun||[]}}
  else if(PLANJ)isler=PLANJ.bekle||[];
  // kart işi bugün bittiyse kalıcı işaretle (ertesi gün yeni kartlar gelse de o günün işi bitmiş sayılır)
  if(aktif&&d+n===0){let deg=false;isler.forEach(it=>{if(it.ac==='kart'&&!k.bitti[it.id]){k.bitti[it.id]=Date.now();deg=true}});if(deg){k.t=Date.now();AKLS.set('ak-bugun',k)}}
  return {k,bk,hs,G,aktif,gi,isler,uzun,bitti}}
function bgPlanHtml(d,n){bgYukle();if(!PLANJ)return '';const B=bgDurum(d,n),{isler,uzun,aktif,gi,G,k,hs,bitti}=B;
  const sayilan=[...isler,...(hs?uzun:[])],kalan=sayilan.filter(i=>!bitti(i)),sira=kalan[0]||(!hs&&uzun.find(i=>!bitti(i)));
  const dk=kalan.reduce((a,i)=>a+(i.dk||0),0),yuz=sayilan.length?Math.round((sayilan.length-kalan.length)/sayilan.length*100):0;
  const acik=k.acik&&k.acik.gun===B.bk&&[...isler,...uzun].find(i=>i.id===k.acik.id&&!bitti(i)&&!bgOto(i));

     <button class="bg-is" data-ac="${esc(it.id)}"><span class="t">${mdi(it.ad)}</span><span class="s"><span class="bg-tur ${esc(it.tur)}">${ISTUR[it.tur]||esc(it.tur)}</span>${it.not?`<span>${mdi(it.not)}</span>`:''}</span></button><span class="dk">${it.dk?it.dk+' dk':''}</span></li>`};
  const bas=aktif?(gi<G.length?`${esc(PLANJ.baslik||'Ünite '+PLANJ.unite)} · Gün ${gi+1} / ${G.length}`:`${esc(PLANJ.baslik||'Ünite '+PLANJ.unite)} · plan bitti`):esc(PLANJ.bekle_baslik||PLANJ.baslik||'');
  return `<section class="bg-kahraman"><div class="bg-ust"><h2>${bas}</h2><span class="small muted">${aktif||sayilan.length?`${sayilan.length-kalan.length} / ${sayilan.length} iş bitti${dk?' · ≈ '+dk+' dk kaldı':''}`:''}${!aktif&&PLANJ.ozet?`<br>${esc(PLANJ.ozet)}`:''}</span></div>
     ${sayilan.length?`<div class="bg-ilerle"><span style="width:${yuz}%"></span></div>`:''}

     ${acik?`<div class="bg-sor"><span class="grow">“${mdi(acik.ad)}” bitti mi?</span><button class="btn sm" data-bit="${esc(acik.id)}">Bitti ✓</button><button class="btn sm" data-ac="${esc(acik.id)}">Devam et</button></div>`:''}
     ${sira?`<button class="bg-basla" data-ac="${esc(sira.id)}"><span class="o">▶</span><span><b>Başla</b><small>Sıradaki: ${ISTUR[sira.tur]?ISTUR[sira.tur]+' · ':''}${mdi(sira.ad)}${sira.dk?' (≈ '+sira.dk+' dk)':''}</small></span></button>`

   ${uzun.length?`<div class="bg-b">${hs?'Uzun gün eki (hafta sonu)':'Vaktin olursa (hafta sonu işleri)'}</div><ol class="bg-isler">${uzun.map(satir).join('')}</ol>`:''}`}
function bgGunlerHtml(){if(!PLANJ||PLANJ.durum!=='aktif'||!(PLANJ.gunler||[]).length)return '';const B=bgDurum(1,1),G=B.G;
  return `<div class="panel bg-gunler"><b>${esc(PLANJ.baslik||'Ünite '+PLANJ.unite)} · ${G.length} gün</b><div class="bg-serit">${G.map((g,i)=>`<div class="${i<B.gi?'ok':i===B.gi?'bu':''}"><b>${i+1}</b>${i<B.gi?'✓':i===B.gi?'bugün':''}</div>`).join('')}</div>

/* =============== EŞİTLEME (telefon ↔ PC) ve BİLDİRİM ===============
   Gizli depodaki "senkron" dalında durum.json: kartlar (P), Bugün işleri ve günün özeti. Her cihaz açılışta, öne gelince ve birkaç
   dakikada bir çeker ve birleştirir; değişiklik olunca (en fazla 2 dakikada bir, arka plana geçerken ve iş bitince hemen) yazar.
   Aynı anda iki cihaz yazarsa (sha çakışması) yeniden çekip birleştirir ve tekrar dener. Bildirim abonelikleri: senkron/bildirim/<cihaz>.json.
   Akşam 18:00 ve 20:00'de gizli depodaki GitHub Actions işi (araclar/bildirim.py) özeti okur; işler bitmediyse bildirim gönderir. */
var SENK=null;
const VAPID_PUB='BDu0TAwIGG3_o5IIQCQA4iXGPEY28XKKGMXNOysnjz1kuJI9wwpB1JrIDZWSofSF2XKBuk3yL5nriebvlgOXyF4';
const SDAL='senkron';
const b64oku=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s||'').replace(/\s/g,'')),c=>c.charCodeAt(0)));
function cihaz(){let c=AKLS.get('ak-cihaz',null);if(!c){const u=navigator.userAgent;c={id:Math.random().toString(36).slice(2,10),ad:/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'PC':/Mac/.test(u)?'Mac':'Cihaz'};AKLS.set('ak-cihaz',c)}return c}
async function senkDosya(yol){const r=await GH.req('contents/'+yol+'?ref='+SDAL,{ok404:true});return r?{sha:r.sha,veri:r.content?JSON.parse(b64oku(r.content)):null}:{sha:null,veri:null}}
async function senkYazDosya(yol,veri,sha,msg){return GH.req('contents/'+yol,{method:'PUT',body:JSON.stringify({message:msg,content:b64txt(JSON.stringify(veri)),branch:SDAL,sha:sha||undefined})})}
// Bugün kayıtlarını birleştir: biten işler birleşir, günlük işler son 7 gün, açık iş en yenisi
function bgBirlestir(u){if(!u||!u.plan)return;const k=AKLS.get('ak-bugun',null);if(!k||k.plan!==u.plan){if(!k||(u.t||0)>(k.t||0))AKLS.set('ak-bugun',u);return}
  Object.assign(k.bitti,u.bitti||{});Object.entries(u.gun||{}).forEach(([g,v])=>{k.gun[g]=Object.assign(k.gun[g]||{},v)});
  const gs=Object.keys(k.gun).sort((a,b)=>new Date(b)-new Date(a));gs.slice(7).forEach(g=>delete k.gun[g]);
  if(u.acik&&(!k.acik||(u.acikT||0)>(k.acikT||0))){k.acik=u.acik;k.acikT=u.acikT}k.t=Math.max(k.t||0,u.t||0);AKLS.set('ak-bugun',k)}
// Günün özeti (bildirim için): kaç iş kaldı, sıradaki ne
function bgOzet(){try{if(!PLANJ)return null;const d=dueList().length,n=newList().length,B=bgDurum(d,n);const say=[...B.isler,...(B.hs?B.uzun:[])],kalan=say.filter(i=>!B.bitti(i));
  return {tarih:bgGun(),kalan:kalan.length,toplam:say.length,dk:kalan.reduce((a,i)=>a+(i.dk||0),0),sira:kalan[0]?String(kalan[0].ad).replace(/[*_`]/g,''):'',gun:B.aktif?B.gi+1:0,t:Date.now()}}catch(e){return null}}
function senkDurum(){if(!SENK)SENK={sha:null,son:'',yaziyor:false,tekrar:false,zaman:null,sonYaz:0,sonCek:0,durum:'',hata:''};return SENK}
async function senkCek(){const S_=senkDurum();if(!GH.ok())return;try{const f=await senkDosya('durum.json');S_.sha=f.sha;S_.sonCek=Date.now();
    if(f.veri){if(f.veri.P){merge(f.veri.P);P.hk=P.hk||[];(f.veri.P.hk||[]).forEach(h=>{if(!P.hk.some(x=>x.id===h.id))P.hk.push(h)});fill();saveLocal();hkYukle()}bgBirlestir(f.veri.bugun)}S_.durum='ok';S_.hata=''}
  catch(e){S_.durum='hata';S_.hata=e.message}}
async function senkYaz(){const S_=senkDurum();if(!GH.ok())return;if(S_.yaziyor){S_.tekrar=true;return}S_.yaziyor=true;
  try{for(let dene=0;dene<3;dene++){const govde={surum:1,P,bugun:AKLS.get('ak-bugun',null),ozet:bgOzet(),cihaz:cihaz().ad,t:Date.now()};
      const imza=JSON.stringify([P,govde.bugun,govde.ozet&&[govde.ozet.tarih,govde.ozet.kalan,govde.ozet.sira]]);if(imza===S_.son&&S_.sha)break;
      try{const r=await senkYazDosya('durum.json',govde,S_.sha,'Eşitleme: '+cihaz().ad);S_.sha=r.content.sha;S_.son=imza;S_.sonYaz=Date.now();S_.durum='ok';S_.hata='';break}
      catch(e){if(/^(409|422)/.test(e.message)||(/^404/.test(e.message)&&S_.sha)){await senkCek();continue}throw e}}}
  catch(e){S_.durum='hata';S_.hata=e.message}
  S_.yaziyor=false;if(S_.tekrar){S_.tekrar=false;senkPlanla(5000)}}
// Değişiklik sonrası yazmayı zamanla (en fazla 2 dakikada bir; ms verilirse daha erken)
function senkPlanla(ms){const S_=senkDurum();if(!GH.ok())return;const bekle=ms!=null?ms:Math.max(5000,120000-(Date.now()-S_.sonYaz));clearTimeout(S_.zaman);S_.zaman=setTimeout(senkYaz,bekle)}
async function senkBaslat(){if(!GH.ok())return;await senkCek();if(typeof render==='function'&&!(tab==='tekrar'&&S.view==='session')&&!(tab==='sinav'&&AS.view==='kos'))render();senkPlanla(3000)}
document.addEventListener('visibilitychange',()=>{if(!GH.ok())return;const S_=senkDurum();
  if(document.visibilityState==='hidden'){clearTimeout(S_.zaman);senkYaz()}
  else if(Date.now()-S_.sonCek>30000)senkBaslat()});
setInterval(()=>{if(GH.ok()&&document.visibilityState==='visible'&&Date.now()-senkDurum().sonCek>180000)senkCek().then(()=>{if(tab==='tekrar'&&S.view==='home')render()})},60000);
setTimeout(senkBaslat,1500);

/* --- Bildirim aboneliği (iPhone: iOS 16.4+, uygulama ana ekrana eklenmiş olmalı) --- */
const bildirimDestek=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const anaEkranda=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const b64u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function bildirimAc(){if(!bildirimDestek())throw new Error(/iPhone|iPad/.test(navigator.userAgent)&&!anaEkranda()?'iPhone\'da önce Safari → Paylaş → Ana Ekrana Ekle; sonra uygulamayı ana ekrandaki simgeden aç.':'Bu tarayıcı bildirim desteklemiyor.');
  if(!GH.ok())throw new Error('Önce İlerleme → Bağlantı ekranından GitHub anahtarını gir.');
  const izin=await Notification.requestPermission();if(izin!=='granted')throw new Error('Bildirim izni verilmedi. Ayarlar → Bildirimler → Fransızca\'dan açabilirsin.');
  const reg=await navigator.serviceWorker.ready;let ab=await reg.pushManager.getSubscription();
  if(!ab)ab=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(VAPID_PUB)});
  const c=cihaz(),yol='bildirim/'+c.id+'.json',f=await senkDosya(yol).catch(()=>({sha:null}));
  await senkYazDosya(yol,{cihaz:c.ad,abonelik:ab.toJSON(),t:Date.now()},f.sha,'Bildirim aboneliği: '+c.ad);AKLS.set('ak-bildirim',{acik:true,t:Date.now()});senkYaz()}
async function bildirimKapat(){try{const reg=await navigator.serviceWorker.ready,ab=await reg.pushManager.getSubscription();if(ab)await ab.unsubscribe()}catch(e){}
  try{const c=cihaz(),yol='bildirim/'+c.id+'.json',f=await senkDosya(yol);if(f.sha)await GH.req('contents/'+yol,{method:'DELETE',body:JSON.stringify({message:'Bildirim kapatıldı: '+c.ad,sha:f.sha,branch:SDAL})})}catch(e){}
  AKLS.set('ak-bildirim',{acik:false,t:Date.now()})}
// Ayarlar ekranındaki "Eşitleme ve bildirimler" bölümü
function senkAyarHtml(){const S_=senkDurum(),b=AKLS.get('ak-bildirim',{}),saat=t=>t?new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';
  return `<div class="set"><label>Telefon ↔ bilgisayar eşitleme</label>${GH.ok()?`<div class="muted small">Kartların ve Bugün işlerin gizli GitHub deponla kendiliğinden eşitlenir (açılışta, uygulamaya dönünce, değişiklikten sonra). ${S_.durum==='hata'?`<span style="color:var(--bad)">Son deneme olmadı: ${esc(S_.hata)}</span>`:`Son çekme ${saat(S_.sonCek)} · son gönderme ${saat(S_.sonYaz)}`}</div>
     <div class="row"><button class="btn" id="senkSimdi">Şimdi eşitle</button></div>`:`<div class="muted small">Eşitleme için bu cihazda <b>İlerleme → Bağlantı</b> ekranından GitHub anahtarını gir (her cihazda bir kez).</div>`}</div>
   <div class="set"><label>Bildirimler (18:00 ve 20:00)</label><div class="muted small">Günün işleri bitmemişse akşam 18:00'de ve 20:00'de bu cihaza bildirim gelir. İşler bittiyse gelmez. iPhone'da uygulama ana ekrana eklenmiş olmalı.</div>
     <div class="row"><button class="btn" id="bildAc">${b.acik?'Bildirimleri yenile':'Bildirimleri aç'}</button>${b.acik?'<button class="btn" id="bildKapat">Kapat</button>':''}</div><div class="small" id="bildSonuc">${b.acik?'✓ Bu cihazda açık.':''}</div></div>`}
function senkAyarBagla(yeniden){if($('senkSimdi'))$('senkSimdi').onclick=async()=>{$('senkSimdi').disabled=true;await senkCek();await senkYaz();yeniden()};
  if($('bildAc'))$('bildAc').onclick=async()=>{const r=$('bildSonuc');r.textContent='Açılıyor…';try{await bildirimAc();r.innerHTML='<span style="color:var(--good)">✓ Bildirimler bu cihazda açık.</span>'}catch(e){r.innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`}};
  if($('bildKapat'))$('bildKapat').onclick=async()=>{await bildirimKapat();yeniden()}}

/* =============== SORU SORU DEĞERLENDİRME ve HATA DEFTERİ (Adım 6) ===============
   degerlendirmeler/<id>.json (gizli depo): bolumler[].sorular[] = {no, soru, cevap, dogru, durum: ok|yari|yanlis|bos, puan, max, neden, konu},
   hatalar[] = {id, konu, yazdigin, dogrusu, neden, kart?: {fr, tr, note}}. Hata kartları P.hk'de durur (eşitlenir) ve CARDS'a eklenir. */
const DRM={ok:['✓','ok'],yari:['½','yari'],yanlis:['✗','no'],bos:['—','bos']};
const sayi=x=>x==null?'':String(x).replace('.',',');
const unitOf=id=>{const m=/^u0?(\d+)/.exec(id||'');return m?+m[1]:8};
function hkKart(h){return {id:h.id,u:h.u,tag:'hata',fr:h.fr,tr:h.tr,en:'',pron:'',lines:[],ex:'',ext:'',parts:'',note:h.note||'',ask:[{q:h.tr,label:'',a:[h.fr]}]}}
function hkYukle(){(P.hk||[]).forEach(h=>{if(byId[h.id])return;const c=hkKart(h);c.ord=CARDS.length;CARDS.push(c);byId[c.id]=c})}
const hkId=(evalId,h)=>'h:'+evalId+':'+h.id;
const hkVar=id=>(P.hk||[]).some(x=>x.id===id);
function hkEkle(evalId,h){const id=hkId(evalId,h);if(hkVar(id)||!h.kart)return;P.hk=P.hk||[];
  P.hk.push({id,u:unitOf(evalId),fr:h.kart.fr,tr:h.kart.tr,note:h.kart.note||h.neden||'',src:evalId,t:Date.now()});
  const u=unitOf(evalId);if(!P.set.units.includes(u)){P.set.units.push(u);P.set.units.sort((a,b)=>a-b)}
  P.c[id]={due:Date.now(),s:1,d:5,st:2,r:1,l:0,lr:Date.now(),ls:0,sd:1};   // bugün tekrar listesine düşsün
  hkYukle();scheduleWrite();senkPlanla(1500)}
function hataSatir(evalId,h,kaynak){const id=hkId(evalId,h),var_=hkVar(id);
  return `<div class="hd-satir"><div class="hd-ust"><span class="ak-chip">${esc(h.konu||'')}</span>${kaynak?`<span class="muted small">${esc(kaynak)}</span>`:''}</div>
    <div class="hd-cift"><span class="hd-yanlis">${mdi(h.yazdigin||'')}</span><span class="hd-ok">→ ${mdi(h.dogrusu||'')}</span></div>
    ${h.neden?`<div class="small muted">${mdi(h.neden)}</div>`:''}
    ${h.kart?(var_?'<div class="small hd-eklendi">✓ Kartlarda</div>':`<button class="btn sm" data-hk="${esc(evalId)}|${esc(h.id)}">Karta ekle</button>`):''}</div>`}
function degHtml(D,evalId,pdf){
  const bol=D.bolumler.map(b=>`<section class="dg-bolum"><div class="dg-bas"><h2>${esc(b.ad)}</h2><b>${sayi(b.puan)}${b.max?' / '+sayi(b.max):''}</b></div>
    ${b.not?`<div class="small muted">${mdi(b.not)}</div>`:''}
    ${b.metin?`<details class="dg-metin"><summary>Senin metnin</summary><div class="ak-doc">${mdr(frb(b.metin))}</div></details>`:''}
    <div class="dg-liste">${b.sorular.map(q=>{const d=DRM[q.durum]||DRM.bos;return `<div class="dg-q ${d[1]}"><span class="dg-isaret">${d[0]}</span>
      <div class="dg-ic"><div class="dg-soru"><b>${esc(q.no||'')}</b> ${mdi(q.soru||'')}</div>
       ${q.durum==='ok'?`<div class="dg-cevap">${mdi(String(q.cevap??''))}</div>`:`<div class="dg-cevap"><span class="hd-yanlis">${mdi(String(q.cevap??'—'))}</span> <span class="hd-ok">→ ${mdi(String(q.dogru??''))}</span></div>`}
       ${q.neden?`<div class="small muted">${mdi(q.neden)}</div>`:''}</div>
      <span class="dg-puan">${q.max!=null?sayi(q.puan)+' / '+sayi(q.max):''}</span></div>`}).join('')}</div></section>`).join('');
  return `<div class="panel dg-sonuc"><div class="kind">${esc(D.tarih||'')}</div><div class="row"><div class="grow"><div class="ak-big">${sayi(D.puan)}<span class="muted small"> / ${sayi(D.max)}</span></div><div class="muted">${esc(D.karar||'')}</div></div></div>
     ${D.ozet?`<div class="ak-md">${mdr(D.ozet)}</div>`:''}</div>
   ${(D.desenler||[]).map(x=>`<div class="ak-blok dikkat"><p class="ak-etiket">${esc(x.baslik)}</p><p>${mdi(x.aciklama||'')}</p>${x.kural?`<p class="ak-formul"><code>${esc(x.kural)}</code></p>`:''}</div>`).join('')}
   ${bol}
   ${(D.hatalar||[]).length?`<section><div class="dg-bas"><h2>Hata defterine giden hatalar</h2><button class="btn sm" id="hkHepsi">Hepsini karta ekle</button></div><div class="hd-liste">${D.hatalar.map(h=>hataSatir(evalId,h)).join('')}</div></section>`:''}
   ${D.sirada?`<section><h2>Sırada</h2><div class="ak-md">${mdr(D.sirada)}</div></section>`:''}
   ${pdf?`<p class="small"><button class="link" data-pdf="${esc(pdf)}">Eski değerlendirme belgesini (PDF) aç</button></p>`:''}`}
function hkBagla(kok,hatalarAl,yeniden){kok.onclick=e=>{const b=e.target.closest('[data-hk]');if(b){const [ev,hid]=b.dataset.hk.split('|'),h=hatalarAl(ev).find(x=>x.id===hid);if(h){hkEkle(ev,h);toast('Karta eklendi: bugünkü tekrara düştü');yeniden()}return}
  if(e.target.closest('#hkHepsi')){const ev=AI.evalId;hatalarAl(ev).forEach(h=>hkEkle(ev,h));toast('Hepsi kartlara eklendi');yeniden();return}
  const p=e.target.closest('[data-pdf]');if(p){AI={view:'deg',yol:p.dataset.pdf};render()}}}
/* Hata defteri: bütün soru soru değerlendirmelerin hataları, konuya göre */
async function iHata(){$('screen').innerHTML=akTop('Hata defteri',true)+'<p class="muted">Yükleniyor…</p>';$('akbk').onclick=()=>{AI={view:'ana'};render()};
  const c=AKCACHE(),liste=(c.sonuclar||[]).filter(r=>/\.json$/i.test(r.degerlendirme||''));const H={};let hepsi=[];
  for(const r of liste){let D=AKLS.get('ak-deg:'+r.id,null);try{const t=await GH.raw(r.degerlendirme);if(t){D=JSON.parse(t);AKLS.set('ak-deg:'+r.id,D)}}catch(e){}
    if(D)H[r.id]={D,r}}
  if(tab!=='ilerleme'||AI.view!=='hata')return;
  Object.values(H).forEach(({D,r})=>(D.hatalar||[]).forEach(h=>hepsi.push({h,ev:r.id,kaynak:r.baslik})));
  const konular={};hepsi.forEach(x=>{(konular[x.h.konu||'Diğer']=konular[x.h.konu||'Diğer']||[]).push(x)});
  const eklenmemis=hepsi.filter(x=>x.h.kart&&!hkVar(hkId(x.ev,x.h))).length;
  $('screen').innerHTML=akTop('Hata defteri',true)+`<p class="muted">Değerlendirmelerdeki hatalar konuya göre. <b>Karta ekle</b> deyince hata, doğrusuyla bir karta döner ve bugünkü tekrara düşer; sonra FSRS ile tekrar edilir. Kartlar telefon ve bilgisayarda eşitlenir.</p>
    ${hepsi.length?`<div class="row small"><span class="grow">${hepsi.length} hata · ${eklenmemis} tanesi henüz kart değil</span></div>`+
      Object.entries(konular).sort((a,b)=>b[1].length-a[1].length).map(([k,xs])=>`<section><div class="dg-bas"><h2>${esc(k)}</h2><span class="muted small">${xs.length}</span></div><div class="hd-liste">${xs.map(x=>hataSatir(x.ev,x.h,x.kaynak)).join('')}</div></section>`).join('')
     :'<div class="ak-note">Henüz soru soru değerlendirilmiş bir teslim yok.</div>'}`;
  $('akbk').onclick=()=>{AI={view:'ana'};render()};
  hkBagla($('screen'),ev=>(H[ev]&&H[ev].D.hatalar)||[],()=>render())}
hkYukle();

    $('pRep').onclick=()=>{R.playing=false;hl();sayStory(R.i,s.lines[R.line][0],R.slow)};
    $('pPrev').onclick=()=>{R.line=Math.max(0,R.line-1);playFrom()};
    $('pNext').onclick=()=>{R.line=Math.min(s.lines.length-1,R.line+1);playFrom()};
    $('pSpd').onclick=()=>{R.slow=!R.slow;$('pSpd').textContent=R.slow?'Yavaş':'Normal'}}
  if(R.step===2&&R.line>0&&!R.playing)setTimeout(hl,50)}
function hl(){document.querySelectorAll('.line').forEach(el=>el.classList.toggle('on',+el.dataset.l===R.line));const on=document.querySelector('.line.on');if(on)on.scrollIntoView({block:'center',behavior:'smooth'})}
function playFrom(){const s=BOOK[R.i];R.playing=true;const b=$('pPlay');if(b){b.innerHTML=I.pause;b.setAttribute('aria-label','Durdur')}hl();
  sayStory(R.i,s.lines[R.line][0],R.slow,ok=>{if(!R.playing)return;if(!ok){R.playing=false;rStory();return}if(R.line<s.lines.length-1){R.line++;savePos();setTimeout(()=>{if(R.playing)playFrom()},450)}else{R.playing=false;R.line=0;savePos();rStory()}})}
function showSheet(h,onSay){$('sheetBody').innerHTML=h;$('sheet').hidden=false;if($('shClose'))$('shClose').onclick=hideSheet;if($('shSay')&&onSay)$('shSay').onclick=onSay}
function hideSheet(){$('sheet').hidden=true}

/* ================= global ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();sayCard(b.dataset.say,!!b.dataset.slow)}},true);
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
document.addEventListener('keydown',e=>{if(tab!=='tekrar'||S.view!=='session'||e.target.tagName==='INPUT')return;
  if(S.phase==='a'&&['1','2','3'].includes(e.key)){const g=document.querySelector(`[data-g="${e.key}"]`);if(g){g.click();return}}
  if(S.phase==='q'&&['1','2','3','4'].includes(e.key)){const o=document.querySelector(`[data-o="${+e.key-1}"]`);if(o){o.click();return}}
  if(e.key===' '||e.key==='Enter'){const b=$('show')||$('go')||$('chkb');if(b){e.preventDefault();b.click()}else if($('flip')){e.preventDefault();$('flip').click()}}
  if(e.key==='r'||e.key==='R'){const it=P.sess.q[P.sess.i],c=byId[it.id];sayCard(it.m==='dict'?c.ask[0].a[0]:c.fr)}});
window.addEventListener('hashchange',()=>{if(/^#(tekrar|oku|ders|sinav|ilerleme)$/.test(location.hash)&&location.hash.slice(1)!==tab)setTab(location.hash.slice(1))});
render();
</script>
